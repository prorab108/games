<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff4e0">
<title>Детские игры — Новые приключения</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff4e0;color-scheme:light;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;touch-action:none;}

  /* ========== ГЛАВНОЕ МЕНЮ ========== */
  #menu{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:24px;
    background:linear-gradient(160deg,rgba(255,244,224,.92),rgba(255,224,196,.95));
    z-index:30;text-align:center;overflow-y:auto;}
  #menu.hidden{display:none;}
  #menu h1{font-size:clamp(28px,7.5vw,52px);margin:0;color:#d14d2a;
    line-height:1.1;text-shadow:0 4px 0 rgba(209,77,42,.18);}
  #menu .subtitle{font-size:clamp(14px,3.8vw,19px);color:#7a3d1a;
    font-weight:700;margin:0;}
  .game-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;
    max-width:720px;width:100%;margin-top:4px;}
  .game-card{display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:22px 20px;border:none;border-radius:26px;cursor:pointer;
    font-family:inherit;color:#fff;min-width:200px;flex:1;max-width:300px;
    transition:transform .15s;text-shadow:0 2px 0 rgba(0,0,0,.15);}
  .game-card:hover{transform:translateY(-4px) scale(1.02);}
  .game-card:active{transform:scale(.96);}
  .game-card.mahjong{background:linear-gradient(160deg,#ff9a76,#e85a2a);
    box-shadow:0 8px 0 #b83a10;}
  .game-card.match3{background:linear-gradient(160deg,#7ed957,#4aa94a);
    box-shadow:0 8px 0 #2e7a2e;}
  .game-card.singers{background:linear-gradient(160deg,#b28ae8,#7a4fd0);
    box-shadow:0 8px 0 #5a35a8;}
  .game-card.puzzle{background:linear-gradient(160deg,#5aa9e6,#2d6fb8);
    box-shadow:0 8px 0 #1d4f8a;}
  .game-card.coloring{background:linear-gradient(160deg,#ff8fb1,#e0517e);
    box-shadow:0 8px 0 #b03a60;}
  .game-card.memory{background:linear-gradient(160deg,#4dd0c4,#2a9d8f);
    box-shadow:0 8px 0 #1d7568;}
  .game-card.catch{background:linear-gradient(160deg,#ffd166,#f0a202);
    box-shadow:0 8px 0 #c07d00;}
  .game-card.count{background:linear-gradient(160deg,#ff9e6d,#e8702a);
    box-shadow:0 8px 0 #b5541a;}
  .game-card.shadow{background:linear-gradient(160deg,#8d99ae,#5c6b82);
    box-shadow:0 8px 0 #414d5e;}
  .game-card.chapaev{background:linear-gradient(160deg,#e07a5f,#a4442e);
    box-shadow:0 8px 0 #7a2f1e;}
  .game-cards{max-width:980px;}
  .game-card .game-icon{font-size:clamp(50px,12vw,72px);line-height:1;}
  .game-card .game-title{font-size:clamp(20px,5vw,26px);font-weight:900;}
  .game-card .game-desc{font-size:clamp(12px,3.2vw,15px);opacity:.92;font-weight:600;}
  .game-card .game-prog{font-size:clamp(12px,3.2vw,14px);font-weight:800;
    background:rgba(0,0,0,.18);padding:5px 14px;border-radius:999px;margin-top:4px;}
  .reset-link{background:none;border:none;color:#a06a3a;font-weight:700;
    font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit;
    margin-top:4px;padding:8px;}
  .ver{font-size:11px;color:#cf9f6e;font-weight:700;margin-top:2px;}

  /* ========== ВЫБОР УРОВНЯ ========== */
  .lvl-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:600px;}
  .lvl-chip{width:auto;min-width:64px;padding:0 12px;height:66px;border:none;border-radius:18px;
    background:rgba(255,255,255,.95);font-family:inherit;cursor:pointer;
    font-weight:900;font-size:24px;color:#7a3d1a;
    box-shadow:0 4px 0 rgba(122,61,26,.28);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:transform .12s;}
  .lvl-chip .st{font-size:11px;font-weight:800;color:#e8a800;line-height:1.2;letter-spacing:-1px;}
  .lvl-chip:hover{transform:translateY(-3px);}
  .lvl-chip:active{transform:scale(.93);}
  .lvl-chip.next{background:linear-gradient(160deg,#ffd15c,#ffb703);}

  /* ========== ТАБЛИЦА РЕЙТИНГА ========== */
  .game-card.lbcard{background:linear-gradient(160deg,#f4a261,#e76f51);
    box-shadow:0 8px 0 #b5503a;}
  .lb-name input{font-family:inherit;font-size:18px;font-weight:800;color:#5a3a7a;
    text-align:center;padding:10px 16px;border-radius:14px;border:3px solid #ffb703;
    outline:none;width:220px;background:rgba(255,255,255,.95);}
  .lb-table{width:min(420px,86vw);margin:0 auto;background:rgba(255,255,255,.9);
    border-radius:16px;padding:8px;box-shadow:0 4px 14px rgba(122,61,26,.15);}
  .lb-row{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;
    font-weight:800;font-size:16px;color:#7a3d1a;border-bottom:1px solid rgba(122,61,26,.12);}
  .lb-row:last-child{border-bottom:none;}
  .lb-row span:first-child{width:28px;text-align:left;}
  .lb-row span:nth-child(2){flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-row span:last-child{width:44px;text-align:right;}
  .lb-head{color:#a06a3a;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
  .lb-first{background:rgba(255,210,63,.35);border-radius:10px;}
  .lb-msg{font-weight:800;color:#2e7a2e;min-height:20px;}
  .lb-stats{font-weight:800;font-size:14px;color:#5a3a7a;background:rgba(255,255,255,.75);
    border-radius:12px;padding:6px 12px;width:min(420px,86vw);margin:0 auto;}
  .lb-note{font-size:12px;color:#a06a3a;max-width:420px;margin:0 auto;line-height:1.4;}
  .lb-sub{font-weight:900;font-size:17px;color:#d14d2a;margin:6px 0 2px;}
  .lb-fb input{font-family:inherit;font-size:15px;font-weight:700;color:#5a3a7a;
    text-align:center;padding:9px 12px;border-radius:14px;border:3px solid #4cc9f0;
    outline:none;width:min(340px,80vw);background:rgba(255,255,255,.95);}

  /* ========== МАГАЗИН МОНСТРОВ ========== */
  #shop{position:fixed;left:0;right:0;bottom:0;z-index:15;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;overflow-x:auto;gap:10px;}
  #shop.hidden{display:none;}
  #shop-cards{display:flex;gap:10px;padding:2px;}
  .shop-card{flex:0 0 auto;width:96px;border:none;border-radius:18px;
    background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(60,40,110,.28);
    padding:7px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;font-family:inherit;transition:transform .12s;}
  .shop-card:active{transform:scale(.94);}
  .shop-card canvas{width:56px;height:56px;}
  .shop-card .nm{font-weight:800;font-size:12px;color:#5a3a7a;}
  .shop-card .pr{font-weight:900;font-size:12px;color:#7a5a1a;background:#ffe9b0;
    border-radius:999px;padding:2px 9px;}
  .shop-card.sel{outline:4px solid #ffb703;}
  .shop-card.poor{opacity:.45;filter:grayscale(.7);}

  /* ========== HUD ========== */
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;
    display:flex;justify-content:space-between;align-items:center;
    gap:8px;pointer-events:none;z-index:10;flex-wrap:wrap;}
  #hud.hidden{display:none;}
  .pill{background:rgba(255,255,255,.94);color:#7a3d1a;font-weight:800;
    padding:8px 16px;border-radius:999px;font-size:clamp(12px,3.2vw,16px);
    box-shadow:0 4px 14px rgba(122,61,26,.18);white-space:nowrap;}
  .btns{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{pointer-events:auto;border:none;background:rgba(255,255,255,.94);
    color:#7a3d1a;font-weight:800;font-size:clamp(12px,3.2vw,15px);
    padding:9px 14px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 14px rgba(122,61,26,.18);
    transition:transform .1s;font-family:inherit;white-space:nowrap;}
  .btn:active{transform:scale(.93);}
  .btn.hidden{display:none;}

  /* ========== ОВЕРЛЕЙ ПОБЕДЫ/СТАРТА ========== */
  #overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;padding:24px;
    text-align:center;background:rgba(255,240,220,.97);
    z-index:20;overflow-y:auto;}
  #overlay.hidden{display:none;}
  #overlay h1{font-size:clamp(24px,7vw,44px);margin:0;color:#d14d2a;
    line-height:1.1;text-shadow:0 3px 0 rgba(209,77,42,.15);}
  #overlay p{margin:0;max-width:520px;font-size:clamp(14px,3.6vw,18px);
    color:#7a3d1a;line-height:1.45;font-weight:600;}
  .ostars{font-size:clamp(48px,12vw,78px);letter-spacing:6px;line-height:1;}
  .ostar{display:inline-block;opacity:0;animation:starPop .55s cubic-bezier(.2,1.5,.4,1) forwards;}
  .ostar.dim{filter:grayscale(1);animation-name:starPopDim;}
  @keyframes starPop{0%{opacity:0;transform:scale(0) rotate(-40deg);}
    65%{opacity:1;transform:scale(1.25) rotate(8deg);}
    100%{opacity:1;transform:scale(1) rotate(0);}}
  @keyframes starPopDim{0%{opacity:0;transform:scale(0);}
    100%{opacity:.35;transform:scale(1);}}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .next-btn{font-size:clamp(17px,4.5vw,22px);font-weight:900;
    padding:16px 32px;border:none;border-radius:999px;
    background:linear-gradient(160deg,#ffd15c,#ffb703);
    color:#7a3d1a;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 0 #d99400;transition:transform .1s;}
  .next-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d99400;}
  .next-btn.secondary{background:linear-gradient(160deg,#e0e0e0,#c0c0c0);
    box-shadow:0 6px 0 #909090;color:#5a3a20;}

  /* ========== ПОДСКАЗКА ========== */
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    color:#7a3d1a;font-size:clamp(12px,3.2vw,15px);font-weight:700;
    background:rgba(255,255,255,.95);
    padding:8px 18px;
    border-radius:999px;box-shadow:0 4px 14px rgba(122,61,26,.15);
    pointer-events:none;z-index:5;transition:opacity .6s;
    white-space:normal;max-width:92vw;text-align:center;}
  #hint.hidden{display:none;}
  #hint.fade{opacity:0;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- ========== ГЛАВНОЕ МЕНЮ ========== -->
<div id="menu">
  <h1>🎮 Детские игры</h1>
  <p class="subtitle">Каждый уровень генерируется заново!</p>
  <div class="game-cards">
    <button class="game-card mahjong" data-game="mahjong">
      <span class="game-icon">🎨</span>
      <span class="game-title">Маджонг</span>
      <span class="game-desc">Найди пары героев</span>
      <span class="game-prog" id="prog-mj">Уровень 1</span>
    </button>
    <button class="game-card match3" data-game="match3">
      <span class="game-icon">🍬</span>
      <span class="game-title">Три в ряд</span>
      <span class="game-desc">Собери героев в линию</span>
      <span class="game-prog" id="prog-m3">Уровень 1</span>
    </button>
    <button class="game-card singers" data-game="singers">
      <span class="game-icon">🎶</span>
      <span class="game-title">Поющие монстры</span>
      <span class="game-desc">Собери свой хор</span>
      <span class="game-prog" id="prog-sm">🪙 0</span>
    </button>
    <button class="game-card puzzle" data-game="puzzle">
      <span class="game-icon">🧩</span>
      <span class="game-title">Пазлы</span>
      <span class="game-desc">Собери картинку</span>
      <span class="game-prog" id="prog-pz">Уровень 1</span>
    </button>
    <button class="game-card coloring" data-game="coloring">
      <span class="game-icon">🎨</span>
      <span class="game-title">Раскраска</span>
      <span class="game-desc">Раскрась картинку</span>
      <span class="game-prog" id="prog-cl">Картина 1</span>
    </button>
    <button class="game-card memory" data-game="memory">
      <span class="game-icon">🃏</span>
      <span class="game-title">Мемори</span>
      <span class="game-desc">Найди пары карт</span>
      <span class="game-prog" id="prog-mm">Уровень 1</span>
    </button>
    <button class="game-card catch" data-game="catch">
      <span class="game-icon">⭐</span>
      <span class="game-title">Звёздочки</span>
      <span class="game-desc">Лови на лету!</span>
      <span class="game-prog" id="prog-ca">Уровень 1</span>
    </button>
    <button class="game-card count" data-game="count">
      <span class="game-icon">🔢</span>
      <span class="game-title">Посчитай</span>
      <span class="game-desc">Сколько тут героев?</span>
      <span class="game-prog" id="prog-cn">Уровень 1</span>
    </button>
    <button class="game-card shadow" data-game="shadow">
      <span class="game-icon">👥</span>
      <span class="game-title">Тени</span>
      <span class="game-desc">Кто спрятался?</span>
      <span class="game-prog" id="prog-sh">Уровень 1</span>
    </button>
    <button class="game-card chapaev" data-game="chapaev">
      <span class="game-icon">♟️</span>
      <span class="game-title">Чапаев</span>
      <span class="game-desc">Выбей шашки котика!</span>
      <span class="game-prog" id="prog-chp">Уровень 1/3</span>
    </button>
    <button class="game-card lbcard" data-game="leaderboard">
      <span class="game-icon">🏆</span>
      <span class="game-title">Рейтинг</span>
      <span class="game-desc">Кто больше звёзд?</span>
      <span class="game-prog" id="prog-lb">⭐ 0</span>
    </button>
  </div>
  <button id="resetBtn" class="reset-link">Сбросить прогресс</button>
  <div class="ver">v3.0</div>
</div>

<!-- ========== HUD (общий) ========== -->
<div id="hud" class="hidden">
  <div class="pill" id="hud-progress">—</div>
  <div class="btns">
    <button class="btn" id="hintBtn">💡</button>
    <button class="btn" id="shuffleBtn">🔀</button>
    <button class="btn" id="soundBtn">🔊</button>
    <button class="btn" id="homeBtn">🏠</button>
  </div>
</div>

<!-- ========== ОВЕРЛЕЙ ========== -->
<div id="overlay" class="hidden"></div>

<!-- ========== ПОДСКАЗКА ========== -->
<div id="hint" class="hidden">—</div>

<!-- ========== МАГАЗИН МОНСТРОВ ========== -->
<div id="shop" class="hidden"><div id="shop-cards"></div></div>

<script>
// Диагностика для телефонов: работает даже если основной скрипт сломался
window.addEventListener('error',function(e){
  try{
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:4px;top:4px;z-index:99999;background:#fff;color:#c00;font:12px monospace;padding:6px 8px;max-width:92vw;white-space:pre-wrap;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4)';
    d.textContent='ОШИБКА: '+(e.message||e.type);
    document.body.appendChild(d);
  }catch(_){}
});
setTimeout(function(){
  if(!window.__jsOk){
    try{
      var d=document.createElement('div');
      d.style.cssText='position:fixed;left:4px;top:4px;z-index:99999;background:#fff;color:#b00;font:12px monospace;padding:6px 8px;border-radius:8px';
      d.textContent='Скрипт не запустился — браузер слишком старый';
      document.body.appendChild(d);
    }catch(_){}
  }
},2500);
</script>
<script>
(function(){
'use strict';
window.__jsOk=true;
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

/* ===== ГЕНЕРАТОР СЛУЧАЙНЫХ ЧИСЕЛ (детерминированный, для уровней) ===== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = (a,b) => a + Math.random()*(b-a); // для эффектов
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function shuffledRange(n,rng){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const elMenu = document.getElementById('menu');
const elHud = document.getElementById('hud');
const elHudProgress = document.getElementById('hud-progress');
const elOverlay = document.getElementById('overlay');
const elHint = document.getElementById('hint');
const elHintBtn = document.getElementById('hintBtn');
const elShuffleBtn = document.getElementById('shuffleBtn');
const elSoundBtn = document.getElementById('soundBtn');
const elHomeBtn = document.getElementById('homeBtn');
const elResetBtn = document.getElementById('resetBtn');
const elShop = document.getElementById('shop');

let W=0,H=0,DPR=1;
let currentGame = 'menu';
let time = 0, last = 0;

/* ================= ЗВУК ================= */
let actx=null, muted=false;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function beep(freq,dur,type,vol,slideTo){ if(muted)return; const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime); if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur); g.gain.setValueAtTime(vol||0.07,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur); o.connect(g);g.connect(a.destination); o.start();o.stop(a.currentTime+dur+0.02); }
function sfxClick(){ beep(500,.05,'sine',.05,620); }
function sfxError(){ beep(220,.12,'square',.05,180); }
function sfxMatch(i){ const n=[[200,.16,'sawtooth',.08,130],[520,.1,'square',.07,780],[880,.1,'sine',.07,1320],[700,.1,'triangle',.07,950],[450,.14,'sine',.07,680],[620,.12,'triangle',.07,860],[320,.14,'sine',.07,480]][i%7]; beep(n[0],n[1],n[2],n[3],n[4]); setTimeout(()=>beep(n[0]*1.35,n[1]*.65,n[2],n[3]*.7),120); }
function sfxPop(combo){ const f=720*Math.pow(1.13,combo||0); beep(f,.08,'sine',.06,f*1.35); }
function sfxLine(){ beep(200,.22,'sawtooth',.07,950); }
function sfxHint(){ beep(880,.08,'sine',.06); setTimeout(()=>beep(1170,.1,'sine',.06),80); }
function sfxShuffle(){ beep(400,.08,'triangle',.06,800); setTimeout(()=>beep(700,.1,'triangle',.06,400),80); }
function sfxFly(){ beep(1000,.06,'sine',.045,1400); }
function sfxWin(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.08),i*120)); }
function sfxLose(){ [440,370,311,262].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.06),i*160)); }
function sfxBuy(){ beep(520,.09,'triangle',.07,780); setTimeout(()=>beep(780,.12,'triangle',.07,1040),90); }
function sfxSell(){ beep(600,.12,'sine',.06,300); }
function sfxMix(){ [660,830,990,1320].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.06),i*90)); }
elSoundBtn.addEventListener('click',()=>{ muted=!muted; elSoundBtn.textContent=muted?'🔇':'🔊'; if(!muted)sfxClick(); });

/* ================= УТИЛИТЫ ================= */
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ roundRect(this,x,y,w,h,r); return this; };
}

/* ================= ПЕРСОНАЖИ (7 штук) ================= */

];
const CHAR_COUNT = CHARACTERS.length; // 7

function preloadCharacterImages(){
  CHARACTERS.forEach(c => {
    if(!c.imgSrc) return;
    const im = new Image();
    im.onload = () => { c.img = im; };
    im.src = c.imgSrc;
  });
}
function drawCharAt(charIndex, sizePx, t){
  const c = CHARACTERS[charIndex];
  if(!c) return;
  if(c.img){ ctx.drawImage(c.img, -sizePx/2, -sizePx/2, sizePx, sizePx); }
  else { c.draw(ctx, sizePx/100, t); }
}

    for(let i=0;i<n;i++){
      const it={x:rnd(0,1), y:rnd(0,1), s:rnd(.5,1.3), ph:rnd(0,TAU), spd:rnd(.3,.9)};
      if(theme.deco==='clouds') it.v=rnd(.008,.02);
      else if(theme.deco==='bubbles') it.v=rnd(.02,.05);
      else if(theme.deco==='stars') it.v=0;
      else it.v=rnd(.015,.04);
      this.items.push(it);
    }
  },
  update(dt){
    for(const it of this.items){
      if(this.theme.deco==='clouds'){ it.x+=it.v*dt; if(it.x>1.15) it.x=-0.15; }
      else if(this.theme.deco==='bubbles'){ it.y-=it.v*dt; if(it.y<-0.05){ it.y=1.05; it.x=rnd(0,1);} }
      else if(this.theme.deco==='stars'){ /* мерцают на месте */ }
      else { it.y+=it.v*dt*.6; it.x+=Math.sin(time+it.ph)*.0004; if(it.y>1.08){ it.y=-0.08; it.x=rnd(0,1);} }
    }
  },
  draw(t){
    if(!this.theme) return;
    const d=this.theme.deco;
    for(const it of this.items){
      const x=it.x*W, y=it.y*H;
      if(d==='clouds'){
        ctx.fillStyle='rgba(255,255,255,.75)';
        ctx.beginPath();
        ctx.ellipse(x,y,34*it.s,14*it.s,0,0,TAU);
        ctx.ellipse(x+24*it.s,y+4*it.s,24*it.s,11*it.s,0,0,TAU);
        ctx.ellipse(x-24*it.s,y+5*it.s,20*it.s,10*it.s,0,0,TAU);
        ctx.fill();
      } else if(d==='stars'){
        const tw=.4+.6*Math.abs(Math.sin(t*1.5+it.ph));
        ctx.fillStyle=`rgba(255,240,180,${tw*.9})`;
        ctx.beginPath(); ctx.arc(x,y,1.2+it.s*1.4,0,TAU); ctx.fill();
        if(it.s>1.15){ ctx.strokeStyle=`rgba(255,240,180,${tw*.5})`; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(x-5,y); ctx.lineTo(x+5,y); ctx.moveTo(x,y-5); ctx.lineTo(x,y+5); ctx.stroke(); }
      } else if(d==='bubbles'){
        const r=3+it.s*6;
        ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.arc(x-r*.3,y-r*.3,r*.25,0,TAU); ctx.fill();
      } else if(d==='hearts'){
        const r=4+it.s*5;
        ctx.fillStyle='rgba(255,150,190,.5)';
        ctx.beginPath(); ctx.moveTo(x,y+r*.4);
        ctx.bezierCurveTo(x-r,y-r*.3,x-r*.5,y-r,x,y-r*.4);
        ctx.bezierCurveTo(x+r*.5,y-r,x+r,y-r*.3,x,y+r*.4); ctx.fill();
      } else if(d==='petals'){
        ctx.save(); ctx.translate(x,y); ctx.rotate(it.ph+time*.5);
        ctx.fillStyle= it.ph>3? 'rgba(255,255,255,.7)':'rgba(255,190,210,.7)';
        ctx.beginPath(); ctx.ellipse(0,0,6*it.s,3*it.s,0,0,TAU); ctx.fill();
        ctx.restore();
      }
    }
  }
};

/* ================= ОБЩИЕ ЭФФЕКТЫ ================= */
const FX={
  particles:[], confetti:[], popups:[], flyers:[], lines:[],
  shakeT:0, shakePow:0,
  shake(p){ this.shakePow=Math.max(this.shakePow,p); this.shakeT=.35; },
  popup(x,y,text,color,size){ this.popups.push({x,y,text,color:color||'#7a3d1a',t:0,life:1.1,size:size||18}); },
  spawnConfetti(){
    const colors=['#ff6b6b','#ffd93d','#6bcB77','#4d96ff','#ff9ec9','#a78bda'];
    for(let i=0;i<150;i++){ this.confetti.push({x:rnd(0,W),y:rnd(-80,-10),vx:rnd(-80,80),vy:rnd(100,280),size:rnd(5,12),color:colors[Math.floor(Math.random()*colors.length)],rotation:rnd(0,TAU),rotSpeed:rnd(-10,10),life:5,maxLife:5}); }
  },
  burstParticles(cx,cy,ch,count,power){
    for(let i=0;i<count;i++){
      const a=rnd(0,TAU), s=rnd(40,130)*(power||1);
      this.particles.push({x:cx+rnd(-8,8),y:cy+rnd(-8,8),vx:Math.cos(a)*s+(ch.dir||0)*40,vy:Math.sin(a)*s-50,life:rnd(.5,1.2),maxLife:1.2,size:rnd(2,5),color:ch.particles,shape:ch.shape,rotation:rnd(0,TAU),rotSpeed:rnd(-6,6),gravity:ch.shape==='bubble'?-80:200});
    }
  },
  update(dt){
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.vy+=p.gravity*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rotation+=p.rotSpeed*dt; p.life-=dt;
      if(p.life<=0) this.particles.splice(i,1);
    }
    for(let i=this.confetti.length-1;i>=0;i--){
      const c=this.confetti[i];
      c.vy+=280*dt; c.vx*=.99; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rotation+=c.rotSpeed*dt; c.life-=dt;
      if(c.life<=0||c.y>H+40) this.confetti.splice(i,1);
    }
    for(let i=this.popups.length-1;i>=0;i--){
      const p=this.popups[i]; p.t+=dt; if(p.t>=p.life) this.popups.splice(i,1);
    }
    for(let i=this.flyers.length-1;i>=0;i--){
      const f=this.flyers[i]; f.t+=dt;
      if(f.t>=f.life){ if(f.onDone)f.onDone(); this.flyers.splice(i,1); }
    }
    for(let i=this.lines.length-1;i>=0;i--){
      const l=this.lines[i]; l.t+=dt; if(l.t>=l.life) this.lines.splice(i,1);
    }
    if(this.shakeT>0) this.shakeT-=dt; else this.shakePow=0;
  },
  applyShake(){
    if(this.shakeT>0){ const k=this.shakeT/.35; ctx.translate((Math.random()-.5)*this.shakePow*k,(Math.random()-.5)*this.shakePow*k); }
  },
  draw(t){
    for(const l of this.lines){
      const p=l.t/l.life, a=(1-p);
      ctx.save(); ctx.globalAlpha=a*.85;
      const g=ctx.createLinearGradient(l.x,l.y,l.x+(l.w||0),l.y+(l.h||0));
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,'#fff7c0'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g;
      roundRect(ctx, l.x, l.y, l.w||6, l.h||6, 8); ctx.fill();
      ctx.restore();
    }
    for(const p of this.particles){
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life/p.maxLife); ctx.translate(p.x,p.y); ctx.rotate(p.rotation); ctx.fillStyle=p.color;
      if(p.shape==='star'){ ctx.beginPath(); for(let i=0;i<5;i++){ const a=i*TAU/5-Math.PI/2, a2=a+TAU/10; ctx.lineTo(Math.cos(a)*p.size,Math.sin(a)*p.size); ctx.lineTo(Math.cos(a2)*p.size*.45,Math.sin(a2)*p.size*.45); } ctx.closePath(); ctx.fill(); }
      else if(p.shape==='heart'){ const r=p.size; ctx.beginPath(); ctx.moveTo(0,r*.4); ctx.bezierCurveTo(-r,-r*.3,-r*.5,-r,0,-r*.4); ctx.bezierCurveTo(r*.5,-r,r,-r*.3,0,r*.4); ctx.fill(); }
      else if(p.shape==='bubble'){ ctx.globalAlpha*=.55; ctx.strokeStyle=p.color; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,0,p.size,0,TAU); ctx.stroke(); }
      else if(p.shape==='note'){ ctx.font=`900 ${p.size}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♪',0,0); }
      else { ctx.beginPath(); ctx.arc(0,0,p.size,0,TAU); ctx.fill(); }
      ctx.restore();
    }
    for(const f of this.flyers){
      const p=clamp(f.t/f.life,0,1), e=p*p*(3-2*p);
      const x=f.x0+(f.x1-f.x0)*e, y=f.y0+(f.y1-f.y0)*e - Math.sin(p*Math.PI)*60;
      ctx.save(); ctx.translate(x,y);
      const sc=1-Math.abs(.5-p)*.4;
      ctx.scale(sc,sc); drawCharAt(f.charIdx, f.size, t); ctx.restore();
    }
    for(const p of this.popups){
      const q=p.t/p.life;
      ctx.save(); ctx.globalAlpha=1-q*q;
      ctx.font=`900 ${p.size}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      const y=p.y-q*46;
      ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.9)';
      ctx.strokeText(p.text,p.x,y);
      ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,y);
      ctx.restore();
    }
    for(const c of this.confetti){
      ctx.save(); ctx.globalAlpha=Math.min(1,c.life/.5); ctx.translate(c.x,c.y); ctx.rotate(c.rotation); ctx.fillStyle=c.color; ctx.fillRect(-c.size/2,-c.size/3,c.size,c.size*.66); ctx.restore();
    }
  }
};

/* ================= ГЕНЕРАТОР ФИГУР МАДЖОНГА ================= */
const MJ_SHAPE_TITLES={flat:'Поляна', pyramid:'Пирамида', wall:'Крепость', towers:'Башни'};
const MJ_SHAPES=['pyramid','wall','towers'];

function rectCells(layer,c0,r0,w,h){ const out=[]; for(let r=0;r<h;r++)for(let c=0;c<w;c++) out.push({layer,c:c0+c,r:r0+r}); return out; }
function pyramidCells(w,h){ const out=[]; let L=0,cs=0,rs=0,cw=w,ch=h;
  while(cw>=1&&ch>=1){ out.push(...rectCells(L,cs,rs,cw,ch)); L++;cs++;rs++;cw-=2;ch-=2; } return out; }
function pyramidCount(w,h){ let n=0,cw=w,ch=h; while(cw>=1&&ch>=1){ n+=cw*ch; cw-=2;ch-=2; } return n; }

function buildShape(name,T,rng){
  let cells=[];
  if(name==='pyramid'){
    let w=6,h=4;
    while(pyramidCount(w,h)<T){ if(w<14&&rng()<.6) w+=2; else h+=2; }
    cells=pyramidCells(w,h);
  } else if(name==='wall'){
    let w=6,h=4;
    const cnt=(w,h)=>w*h+(w-4)*(h-2);
    while(cnt(w,h)<T){ if(w<14&&rng()<.5) w+=2; else h+=2; }
    const tw=w-4, c0=1+Math.floor(rng()*3);
    cells=[...rectCells(0,0,0,w,h), ...rectCells(1,c0,1,tw,h-2)];
  } else if(name==='diamond'){
    let R=2; while(diamondCount(R)<T) R++;
    cells=diamondCells(R);
  } else { // towers
    let h=4;
    const wA=3+Math.floor(rng()*2), wB=3+Math.floor(rng()*2);
    const cnt=h=>wA*h+(wA-2)*(h-2)+wB*h+(wB-2)*(h-2);
    while(cnt(h)<T) h+=2;
    cells=[...rectCells(0,0,0,wA,h), ...rectCells(1,1,1,wA-2,h-2)];
    const off=wA+1;
    cells.push(...rectCells(0,off,0,wB,h), ...rectCells(1,off+1,1,wB-2,h-2));
  }
  return trimCells(cells,T,rng);
}

/* Число структурно свободных плиток (без учёта персонажей) */
function structFreeCount(cells){
  const set=new Set(cells.map(c=>c.layer+':'+c.c+':'+c.r));
  let free=0;
  for(const c of cells){
    const ux=2*c.c+c.layer, uy=2*c.r+c.layer;
    let covered=false;
    for(const o of cells){
      if(o.layer!==c.layer+1)continue;
      if(Math.abs((2*o.c+o.layer)-ux)<2&&Math.abs((2*o.r+o.layer)-uy)<2){ covered=true; break; }
    }
    if(covered)continue;
    const hasL=set.has(c.layer+':'+(c.c-1)+':'+c.r);
    const hasR=set.has(c.layer+':'+(c.c+1)+':'+c.r);
    if(!hasL||!hasR) free++;
  }
  return free;
}

/* Аккуратно подрезаем фигуру до нужного числа плиток:
   нельзя убирать опоры, а в конце гарантируем достаточно свободных краёв */
function trimCells(cells,T,rng){
  if(cells.length<=T) return cells.map(c=>({...c}));
  const work=cells.map(c=>({...c,removed:false}));
  const removedOrder=[];
  let n=work.length, guard=4000;
  function coveredBy(c){
    for(const o of work){
      if(o.removed||o.layer!==c.layer+1)continue;
      if(Math.abs((2*o.c+o.layer)-(2*c.c+c.layer))<2 && Math.abs((2*o.r+o.layer)-(2*c.r+c.layer))<2) return true;
    }
    return false;
  }
  while(n>T&&guard--){
    let cx=0,cy=0;
    for(const c of work){ if(!c.removed){ cx+=2*c.c+c.layer; cy+=2*c.r+c.layer; } }
    cx/=n; cy/=n;
    let best=null,bestScore=-1;
    for(const c of work){
      if(c.removed||coveredBy(c))continue;
      const d=Math.hypot(2*c.c+c.layer-cx,2*c.r+c.layer-cy)+rng()*1.5;
      if(d>bestScore){ bestScore=d; best=c; }
    }
    if(!best)break;
    best.removed=true; removedOrder.push(best); n--;
  }
  // возвращаем крайние плитки, пока свободных краёв меньше 4
  let safety=200;
  while(structFreeCount(work.filter(c=>!c.removed))<4 && removedOrder.length && safety--){
    const r=removedOrder.shift(); r.removed=false; n++;
  }
  return work.filter(c=>!c.removed);
}

/* Раздача пар «с конца» — гарантирует решаемость расклада */
function dealSolvable(cellsIn,rng){
  const tiles=cellsIn.map(c=>({...c,placed:false,char:-1}));
  const placed=[];
  const unitOverlap=(a,b)=>{
    return Math.abs((2*a.c+a.layer)-(2*b.c+b.layer))<2 && Math.abs((2*a.r+a.layer)-(2*b.r+b.layer))<2;
  };
  function freeAmong(t){
    const ux=2*t.c+t.layer, uy=2*t.r+t.layer;
    for(const o of placed){
      if(o.layer===t.layer+1 && Math.abs((2*o.c+o.layer)-ux)<2 && Math.abs((2*o.r+o.layer)-uy)<2) return false;
    }
    let L=false,R=false;
    for(const o of placed){ if(o.layer===t.layer&&o.r===t.r){ if(o.c===t.c-1)L=true; else if(o.c===t.c+1)R=true; } }
    return !(L&&R);
  }
  const pairs=Math.floor(tiles.length/2);
  const order=[]; while(order.length<pairs){ order.push(...shuffledRange(CHAR_COUNT,rng)); } order.length=pairs;
  for(let p=0;p<pairs;p++){
    const free=tiles.filter(t=>!t.placed&&freeAmong(t));
    if(free.length<2) return null;
    const a=free[Math.floor(rng()*free.length)];
    const others=free.filter(t=>t!==a&&!unitOverlap(a,t));
    if(!others.length) return null;
    const b=others[Math.floor(rng()*others.length)];
    const ci=order[p];
    for(const t of [a,b]){ t.placed=true; t.char=ci; placed.push(t); }
  }
  return tiles;
}

function genMahjongLevel(levelIndex){
  const seed=1000+levelIndex*7919;
  const rng=mulberry32(seed^0x5f3a);
  const T=Math.min(8+levelIndex*4,96); // число плиток растёт с уровнем
  let cells, shapeName;
  if(levelIndex<2){ // маленькие уровни — ровный прямоугольник
    shapeName='flat';
    const cols=clamp(Math.round(T/4),2,10);
    const rows=Math.ceil(T/cols);
    cells=rectCells(0,0,0,cols,rows).slice(0,T);
  } else {
    shapeName=MJ_SHAPES[Math.floor(rng()*MJ_SHAPES.length)];
    cells=buildShape(shapeName,T,rng);
  }
  let dealt=dealSolvable(cells,mulberry32(seed+13));
  for(let attempt=1;attempt<20&&!dealt;attempt++) dealt=dealSolvable(cells,mulberry32(seed+13+attempt*104729));
  if(!dealt){ // запасной вариант: случайная раздача
    const chars=[]; for(let i=0;i<cells.length/2;i++){ const ci=Math.floor(rng()*CHAR_COUNT); chars.push(ci,ci); }
    shuffle(chars); cells=cells.map((c,i)=>({...c,char:chars[i]}));
  } else cells=dealt.filter(t=>t.char>=0).map(c=>({...c}));
  return {cells, shapeName, theme:THEMES[Math.floor(rng()*THEMES.length)]};
}

/* ================= ИГРА 1: МАДЖОНГ ================= */
const mahjong = {
  state:'idle', tiles:[], selectedTile:null, matchesFound:0, totalPairs:0,
  currentLevel:0, levelCompleteDelay:0, hintTiles:null, hintTime:0,
  CELL:60, baseX:0, baseY:0, time:0, assists:0, _hudSec:-1, theme:THEMES[0], shapeTitle:'', shuffleCooldown:0,

  start(levelIndex){
    currentGame='mahjong';
    this.state='playing';
    this.currentLevel=levelIndex;
    const gen=genMahjongLevel(levelIndex);
    this.theme=gen.theme; ambient.set(gen.theme);
    this.shapeTitle=MJ_SHAPE_TITLES[gen.shapeName]||'Фигура';
    this.totalPairs=gen.cells.length/2;
    this.matchesFound=0; this.selectedTile=null;
    this.hintTiles=null; this.hintTime=0; this.levelCompleteDelay=0;
    this.time=0; this.assists=0; this._hudSec=-1; this.shuffleCooldown=0;
    this.startTime=time;
    this.tiles=shuffle(gen.cells.map((c,i)=>({ ...c, charIndex:c.char, state:'idle', x:0,y:0,w:0,h:0, escapeT:0, escapeStart:0, particlesSpawned:false, delay:.1+i*.018 })));
    this.layout();
    elHud.classList.remove('hidden');
    elHintBtn.classList.remove('hidden');
    elShuffleBtn.classList.remove('hidden');
    elOverlay.classList.add('hidden');
    elMenu.classList.add('hidden');
    this.syncHud();
    showHint(`Форма: ${this.shapeTitle} · Тема: ${this.theme.name}. Найди пары одинаковых героев! 🎯`, 4500);
  },
  syncHud(){
    setHudProgress(`Ур.${this.currentLevel+1} · Пары ${this.matchesFound}/${this.totalPairs} · ⏱ ${fmtTime(this.time)}`);
  },
  layout(){
    if(!this.tiles.length) return;
    let maxUX=0,maxUY=0;
    for(const t of this.tiles){
      const ux=2*t.c+t.layer+2, uy=2*t.r+t.layer+2;
      if(ux>maxUX)maxUX=ux; if(uy>maxUY)maxUY=uy;
    }
    const topPad=90,bottomPad=70,sidePad=12;
    const availW=W-sidePad*2, availH=H-topPad-bottomPad;
    const fieldW=maxUX/2, fieldH=maxUY/2;
    this.CELL=clamp(Math.floor(Math.min(availW/fieldW,availH/fieldH)),18,72);
    const actualW=fieldW*this.CELL, actualH=fieldH*this.CELL;
    this.baseX=(W-actualW)/2; this.baseY=topPad+(availH-actualH)/2;
    for(const t of this.tiles){
      const ux=2*t.c+t.layer, uy=2*t.r+t.layer;
      t.x=this.baseX+ux*this.CELL/2; t.y=this.baseY+uy*this.CELL/2;
      t.w=this.CELL; t.h=this.CELL;
    }
  },
  isAlive(t){ return t.state!=='gone'&&t.state!=='escaping'; },
  overlapsInUnits(a,b){
    const ax=2*a.c+a.layer, ay=2*a.r+a.layer;
    const bx=2*b.c+b.layer, by=2*b.r+b.layer;
    return ax<bx+2&&ax+2>bx&&ay<by+2&&ay+2>by;
  },
  isFree(tile){
    if(!this.isAlive(tile))return false;
    for(const o of this.tiles){ if(!this.isAlive(o))continue; if(o.layer!==tile.layer+1)continue; if(this.overlapsInUnits(o,tile))return false; }
    let left=false,right=false;
    for(const o of this.tiles){ if(!this.isAlive(o))continue; if(o.layer!==tile.layer)continue; if(o.r!==tile.r)continue; if(o.c===tile.c-1)left=true; else if(o.c===tile.c+1)right=true; }
    return !left||!right;
  },
  findAvailablePair(){
    const free=this.tiles.filter(t=>this.isAlive(t)&&this.isFree(t));
    for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)if(free[i].charIndex===free[j].charIndex)return [free[i],free[j]];
    return null;
  },
  handleClick(px,py){
    if(this.state!=='playing') return;
    let found=null;
    for(let layer=8;layer>=0;layer--){
      for(const t of this.tiles){
        if(t.layer!==layer)continue; if(!this.isAlive(t))continue;
        if(px>=t.x&&px<=t.x+t.w&&py>=t.y&&py<=t.y+t.h){ found=t; break; }
      }
      if(found)break;
    }
    if(!found)return;
    if(!this.isFree(found)){ sfxError(); FX.popup(found.x+found.w/2,found.y,'Занято!','#e85a2a',15); return; }
    if(found===this.selectedTile){ found.state='idle'; this.selectedTile=null; sfxClick(); return; }
    if(!this.selectedTile){ found.state='selected'; this.selectedTile=found; sfxClick(); return; }
    if(this.selectedTile.charIndex===found.charIndex){
      this.startEscape(this.selectedTile); this.startEscape(found);
      sfxMatch(found.charIndex);
      this.matchesFound++;
      this.selectedTile=null; this.hintTiles=null;
      FX.popup(found.x+found.w/2,found.y-6,`+${this.matchesFound*10}`,'#2e7a2e',17);
      if(this.matchesFound>=this.totalPairs){
        this.state='complete'; sfxWin(); FX.spawnConfetti(); this.levelCompleteDelay=2.2;
      }
    } else {
      this.selectedTile.state='idle'; found.state='selected'; this.selectedTile=found; sfxError();
    }
  },
  startEscape(t){ t.state='escaping'; t.escapeStart=time; t.escapeT=0; t.particlesSpawned=false; },
  getEscapeTransform(tile){
    const t=clamp(tile.escapeT,0,1); const ch=CHARACTERS[tile.charIndex]; const ease=t*t; const dist=600;
    let ox=0,oy=0,rot=0,scale=1;
    switch(ch.escape){
      case 'drive': ox=ease*dist*ch.dir; oy=Math.sin(t*40)*2.5; rot=Math.sin(t*20)*.04; break;
      case 'bounce': ox=ease*dist*ch.dir; oy=-Math.abs(Math.sin(t*Math.PI*3))*40*(1-t*.6); break;
      case 'spin': oy=-ease*dist; rot=t*TAU*1.8; scale=1-t*.45; break;
      case 'hop': ox=ease*dist*ch.dir; oy=-Math.abs(Math.sin(t*Math.PI*5))*35*(1-t*.5); rot=Math.sin(t*12)*.1; break;
      case 'float': oy=-ease*dist; ox=Math.sin(t*8)*16*(1-t); rot=Math.sin(t*4)*.12; break;
      case 'launch': oy=-ease*dist*1.25; ox=Math.sin(t*10)*8*(1-t); rot=Math.sin(t*8)*.05; scale=1+t*.3; break;
      case 'fly': oy=-ease*dist*1.05; ox=Math.sin(t*16)*12*(1-t); rot=Math.sin(t*9)*.08; scale=1-t*.15; break;
    }
    const alpha=t<.72?1:Math.max(0,1-(t-.72)/.28);
    return {ox,oy,rot,scale,alpha};
  },
  doHint(){
    if(this.state!=='playing')return;
    const pair=this.findAvailablePair();
    if(!pair){ showHint('Нет ходов! Нажми 🔀',2000); return; }
    this.hintTiles=pair; this.hintTime=2.5; this.assists++; sfxHint();
  },
  doShuffle(){
    if(this.state!=='playing')return;
    const alive=this.tiles.filter(t=>this.isAlive(t));
    if(alive.length<2)return;
    const chars=alive.map(t=>t.charIndex);
    let tries=0;
    do{ shuffle(chars); for(let i=0;i<alive.length;i++) alive[i].charIndex=chars[i]; tries++; } while(!this.findAvailablePair() && tries<60);
    if(this.selectedTile){ this.selectedTile.state='idle'; this.selectedTile=null; }
    this.hintTiles=null; this.assists++; sfxShuffle();
    showHint('Перемешали! 🔀',1500);
    for(const t of alive) FX.burstParticles(t.x+t.w/2,t.y+t.h/2,CHARACTERS[t.charIndex],4,.6);
  },
  starsFor(){
    const par=this.totalPairs*5;
    if(this.time<=par&&this.assists===0) return 3;
    if(this.time<=par*2.2||this.assists<=2) return 2;
    return 1;
  },
  update(dt){
    if(this.state!=='playing'&&this.state!=='complete') return;
    if(this.state==='playing') this.time+=dt;
    const sec=Math.floor(this.time);
    if(sec!==this._hudSec){ this._hudSec=sec; this.syncHud(); }
    for(const t of this.tiles){
      if(t.state==='escaping'){
        t.escapeT=(time-t.escapeStart)/1.1;
        if(!t.particlesSpawned&&t.escapeT>.02){ t.particlesSpawned=true; FX.burstParticles(t.x+t.w/2,t.y+t.h/2,CHARACTERS[t.charIndex],10,1); }
        if(t.escapeT>=1.15) t.state='gone';
      }
    }
    if(this.hintTime>0){ this.hintTime-=dt; if(this.hintTime<=0) this.hintTiles=null; }
    // авто-перемешивание, если свободных пар не осталось
    if(this.state==='playing'){
      if(this.shuffleCooldown>0) this.shuffleCooldown-=dt;
      else if(!this.tiles.some(t=>t.state==='escaping') && !this.findAvailablePair()){
        this.doShuffle(); this.shuffleCooldown=1.2;
      }
    }
    if(this.state==='complete'&&this.levelCompleteDelay>0){
      this.levelCompleteDelay-=dt;
      if(this.levelCompleteDelay<=0){
        const stars=this.starsFor();
        showWin('mahjong',this.currentLevel,stars,`Время: ${fmtTime(this.time)} · Подсказок: ${this.assists}`);
      }
    }
  },
  drawTileBody(tile,t,isEscaping){
    const w=tile.w,h=tile.h,sideH=Math.max(3,this.CELL*.1);
    ctx.fillStyle='#c9b89a'; roundRect(ctx,-w/2+2,-h/2+h*.92,w,sideH,4); ctx.fill(); roundRect(ctx,w/2-2,-h/2+6,sideH,h*.92,4); ctx.fill();
    ctx.fillStyle=isEscaping?'rgba(0,0,0,.08)':'rgba(122,61,26,.2)'; roundRect(ctx,-w/2+3,-h/2+5,w,h,10); ctx.fill();
    const cg=ctx.createLinearGradient(0,-h/2,0,h/2); cg.addColorStop(0,'#fffdf5'); cg.addColorStop(1,'#f0e2c8');
    ctx.fillStyle=cg; roundRect(ctx,-w/2,-h/2,w,h,10); ctx.fill();
    const isSel=tile.state==='selected'; const isHint=this.hintTiles&&this.hintTiles.includes(tile);
    let bc='#d8c8a8'; if(isSel)bc='#ffb703'; else if(isHint)bc='#ff5a5f';
    ctx.strokeStyle=bc; ctx.lineWidth=isSel||isHint?3:1.5; roundRect(ctx,-w/2,-h/2,w,h,10); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)'; roundRect(ctx,-w/2+3,-h/2+3,w-6,h-6,7); ctx.fill();
    if(isSel){ const p=.3+Math.sin(t*8)*.15; ctx.fillStyle=`rgba(255,215,100,${p})`; roundRect(ctx,-w/2-3,-h/2-3,w+6,h+6,12); ctx.fill(); }
    if(isHint){ const p=.35+Math.sin(t*10)*.2; ctx.fillStyle=`rgba(255,90,95,${p})`; roundRect(ctx,-w/2-4,-h/2-4,w+8,h+8,13); ctx.fill(); }
    drawCharAt(tile.charIndex, Math.min(w,h)*0.8, t);
  },
  drawTile(tile,t){
    if(tile.state==='gone')return;
    if(tile.state==='escaping'){
      const tr=this.getEscapeTransform(tile);
      ctx.save(); ctx.globalAlpha=tr.alpha; ctx.translate(tile.x+tile.w/2+tr.ox,tile.y+tile.h/2+tr.oy); ctx.rotate(tr.rot); ctx.scale(tr.scale,tr.scale); this.drawTileBody(tile,t,true); ctx.restore(); return;
    }
    // появление плиток в начале уровня
    const sp=clamp((time-this.startTime-tile.delay)/.35,0,1);
    if(sp<=0)return;
    const back=1+2.2*Math.pow(sp-1,3)+1.2*Math.pow(sp-1,2); // лёгкий «овершут»
    let yOff=0,scale=back;
    if(tile.state==='selected'){ yOff=-6+Math.sin(t*10)*2; scale=Math.min(1.06,back*1.04); }
    ctx.save(); ctx.globalAlpha=sp; ctx.translate(tile.x+tile.w/2,tile.y+tile.h/2+yOff); ctx.scale(scale,scale); this.drawTileBody(tile,t,false); ctx.restore();
  },
  render(t){
    ctx.save();
    FX.applyShake();
    const th=this.theme;
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,th.sky[0]); bg.addColorStop(.55,th.sky[1]); bg.addColorStop(1,th.sky[2]);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    const sorted=this.tiles.slice().sort((a,b)=>a.layer-b.layer);
    for(const tile of sorted) this.drawTile(tile,t);
    FX.draw(t);
    ctx.restore();
  }
};

/* ================= ИГРА 2: ТРИ В РЯД ================= */
const match3 = {
  state:'idle', cols:7, rows:7, grid:[], CELL:60, baseX:0, baseY:0,
  selected:null, dyingTiles:[], busy:false, matchDelay:0,
  goals:[], level:0, score:0, moves:0, totalMoves:0, combo:0,
  hintMove:null, hintT:0, theme:THEMES[0], pool:[],
  goalPos:[], DIE_TIME:0.6,

  genLevel(L){
    const seed=5000+L*7919, rng=mulberry32(seed^0x77);
    const nGoals=Math.min(5,2+Math.floor(L/2));
    const chars=shuffledRange(CHAR_COUNT,rng).slice(0,nGoals);
    const base=3+Math.floor(L*0.7);
    const goals=chars.map(ci=>({charIdx:ci, need:Math.min(12,base+Math.floor(rng()*3)), got:0, pulse:0}));
    const total=goals.reduce((s,g)=>s+g.need,0);
    const moves=Math.ceil(total*1.5)+6;
    const theme=THEMES[Math.floor(rng()*THEMES.length)];
    const pool=chars.slice();
    const extras=shuffledRange(CHAR_COUNT,rng).filter(x=>!chars.includes(x));
    while(pool.length<Math.min(6,nGoals+2)&&extras.length) pool.push(extras.pop());
    return {goals,moves,theme,pool};
  },
  start(levelIndex){
    currentGame='match3';
    this.state='playing';
    this.level=levelIndex;
    const gen=this.genLevel(levelIndex);
    this.theme=gen.theme; ambient.set(gen.theme);
    this.goals=gen.goals; this.moves=gen.moves; this.totalMoves=gen.moves;
    this.pool=gen.pool;
    this.score=0; this.selected=null; this.combo=0;
    this.busy=false; this.matchDelay=0;
    this.hintMove=null; this.hintT=0; this.goalPos=[];
    let guard=30;
    do{ this.initGrid(); guard--; } while(guard>0&&(this.findMatches().cells.length>0||!this.findAnyMove()));
    // если всё же собрались линии — красиво разлетаются сразу
    const initM=this.findMatches();
    if(initM.cells.length>0){ this.busy=true; this.combo=1; this.removeMatches(initM); }
    this.layout();
    elHud.classList.remove('hidden');
    elHintBtn.classList.remove('hidden');
    elShuffleBtn.classList.remove('hidden');
    elOverlay.classList.add('hidden');
    elMenu.classList.add('hidden');
    this.syncHud();
    showHint(`Тема: ${this.theme.name}. Собери героев в линию! 4 в ряд — сюрприз ✨`, 4500);
  },
  syncHud(){ setHudProgress(`Ур.${this.level+1} · Ходы: ${this.moves}`); },
  randChar(){ return this.pool[Math.floor(Math.random()*this.pool.length)]; },
  initGrid(){
    this.grid=[];
    for(let r=0;r<this.rows;r++){
      this.grid[r]=[];
      for(let c=0;c<this.cols;c++){
        let charIdx,tries=0;
        do{ charIdx=this.randChar(); tries++; } while(tries<30&&this._wouldMatch(r,c,charIdx));
        this.grid[r][c]={charIdx, y:(r-this.rows-2)*this.CELL, delay:(this.rows-r)*.05+c*.015, dying:false};
      }
    }
    this.dyingTiles=[];
  },
  _wouldMatch(r,c,charIdx){
    if(c>=2&&this.grid[r][c-1]&&this.grid[r][c-2]&&this.grid[r][c-1].charIdx===charIdx&&this.grid[r][c-2].charIdx===charIdx) return true;
    if(r>=2&&this.grid[r-1]&&this.grid[r-2]&&this.grid[r-1][c].charIdx===charIdx&&this.grid[r-2][c].charIdx===charIdx) return true;
    return false;
  },
  layout(){
    const topPad=130,bottomPad=40,sidePad=16;
    const availW=W-sidePad*2, availH=H-topPad-bottomPad;
    this.CELL=Math.floor(Math.min(availW/this.cols,availH/this.rows));
    this.CELL=clamp(this.CELL,26,80);
    const actualW=this.CELL*this.cols, actualH=this.CELL*this.rows;
    this.baseX=(W-actualW)/2;
    this.baseY=topPad+(availH-actualH)/2;
  },
  findMatches(){
    const cellsSet=new Set(); const runs=[];
    for(let r=0;r<this.rows;r++){
      let c=0;
      while(c<this.cols){
        const t=this.grid[r][c];
        if(!t||t.dying){ c++; continue; }
        let len=1;
        while(c+len<this.cols){ const u=this.grid[r][c+len]; if(u&&!u.dying&&u.charIdx===t.charIdx)len++; else break; }
        if(len>=3){ for(let i=0;i<len;i++)cellsSet.add(r+','+(c+i)); runs.push({dir:'h',r,c0:c,len}); }
        c+=len;
      }
    }
    for(let c=0;c<this.cols;c++){
      let r=0;
      while(r<this.rows){
        const t=this.grid[r][c];
        if(!t||t.dying){ r++; continue; }
        let len=1;
        while(r+len<this.rows){ const u=this.grid[r+len][c]; if(u&&!u.dying&&u.charIdx===t.charIdx)len++; else break; }
        if(len>=3){ for(let i=0;i<len;i++)cellsSet.add((r+i)+','+c); runs.push({dir:'v',c,r0:r,len}); }
        r+=len;
      }
    }
    // Бонус: линия из 4+ сжигает весь ряд/столбец!
    for(const run of runs){
      if(run.len>=4){
        if(run.dir==='h'){ for(let cc=0;cc<this.cols;cc++)cellsSet.add(run.r+','+cc); }
        else { for(let rr=0;rr<this.rows;rr++)cellsSet.add(rr+','+run.c); }
      }
    }
    return { cells:[...cellsSet].map(s=>{ const [r,c]=s.split(',').map(Number); return {r,c}; }), runs };
  },
  applyGravity(){
    for(let c=0;c<this.cols;c++){
      let writeRow=this.rows-1;
      for(let r=this.rows-1;r>=0;r--){
        if(this.grid[r][c]){
          if(r!==writeRow){ this.grid[writeRow][c]=this.grid[r][c]; this.grid[r][c]=null; }
          writeRow--;
        }
      }
      for(let r=writeRow;r>=0;r--){ this.grid[r][c]={charIdx:this.randChar(), y:-(writeRow-r+1)*this.CELL, delay:0, dying:false}; }
    }
  },
  removeMatches(m){
    let hadLine=false;
    for(const cell of m.cells){
      const t=this.grid[cell.r][cell.c];
      if(!t||t.dying) continue;
      t.dying=true;
      this.dyingTiles.push({r:cell.r,c:cell.c,charIdx:t.charIdx,t:0,maxT:this.DIE_TIME});
      for(const goal of this.goals){
        if(goal.charIdx===t.charIdx&&goal.got<goal.need){
          goal.got++;
          // герой летит к своей цели
          const gp=this.goalPos[this.goals.indexOf(goal)];
          if(gp) FX.flyers.push({x0:this.baseX+cell.c*this.CELL+this.CELL/2, y0:this.baseY+cell.r*this.CELL+this.CELL/2,
            x1:gp.x, y1:gp.y, t:0, life:.55, charIdx:t.charIdx, size:this.CELL*.55, onDone:()=>{ goal.pulse=1; sfxFly(); }});
          break;
        }
      }
    }
    for(const run of m.runs){
      if(run.len>=4){
        hadLine=true;
        if(run.dir==='h') FX.lines.push({x:this.baseX,y:this.baseY+run.r*this.CELL,w:this.cols*this.CELL,h:this.CELL,t:0,life:.4});
        else FX.lines.push({x:this.baseX+run.c*this.CELL,y:this.baseY,w:this.CELL,h:this.rows*this.CELL,t:0,life:.4});
      }
    }
    if(hadLine){ sfxLine(); FX.shake(7); FX.popup(W/2,H/2,'Огонь! 🔥','#e85a2a',26); }
    const pts=m.cells.length*10*Math.max(1,this.combo);
    this.score+=pts;
    const first=m.cells[Math.floor(m.cells.length/2)];
    FX.popup(this.baseX+first.c*this.CELL+this.CELL/2,this.baseY+first.r*this.CELL,`+${pts}`,'#2e7a2e',18);
    if(this.combo>=2) FX.popup(W/2,H*.35,`Комбо x${this.combo}! 💫`,'#d14d2a',24);
    sfxPop(this.combo);
  },
  handleClick(px,py){
    if(this.state!=='playing'||this.busy||this.matchDelay>0||this.dyingTiles.length>0) return;
    const c=Math.floor((px-this.baseX)/this.CELL);
    const r=Math.floor((py-this.baseY)/this.CELL);
    if(r<0||r>=this.rows||c<0||c>=this.cols) return;
    if(!this.grid[r][c]||this.grid[r][c].dying) return;
    if(!this.selected){ this.selected={r,c}; sfxClick(); return; }
    const s=this.selected;
    if(s.r===r&&s.c===c){ this.selected=null; return; }
    if(Math.abs(s.r-r)+Math.abs(s.c-c)!==1){ this.selected={r,c}; sfxClick(); return; }
    const a=this.grid[s.r][s.c], b=this.grid[r][c];
    this.grid[s.r][s.c]=b; this.grid[r][c]=a;
    const m=this.findMatches();
    if(m.cells.length>0){
      this.selected=null; this.busy=true; this.combo=1;
      this.moves--; this.syncHud();
      this.removeMatches(m);
      FX.burstParticles(this.baseX+c*this.CELL+this.CELL/2,this.baseY+r*this.CELL+this.CELL/2,CHARACTERS[a.charIdx],5,.6);
    } else {
      this.grid[s.r][s.c]=a; this.grid[r][c]=b; sfxError(); this.selected=null;
      FX.popup(px,py-10,'Так нельзя','#e85a2a',14);
    }
  },
  findAnyMove(){
    for(let r=0;r<this.rows;r++){
      for(let c=0;c<this.cols;c++){
        if(!this.grid[r]||!this.grid[r][c]) continue;
        if(c<this.cols-1&&this.grid[r][c+1]){
          [this.grid[r][c],this.grid[r][c+1]]=[this.grid[r][c+1],this.grid[r][c]];
          const has=this.findMatches().cells.length>0;
          [this.grid[r][c],this.grid[r][c+1]]=[this.grid[r][c+1],this.grid[r][c]];
          if(has) return [{r,c},{r,c:c+1}];
        }
        if(r<this.rows-1&&this.grid[r+1]&&this.grid[r+1][c]){
          [this.grid[r][c],this.grid[r+1][c]]=[this.grid[r+1][c],this.grid[r][c]];
          const has=this.findMatches().cells.length>0;
          [this.grid[r][c],this.grid[r+1][c]]=[this.grid[r+1][c],this.grid[r][c]];
          if(has) return [{r,c},{r:r+1,c}];
        }
      }
    }
    return null;
  },
  doHint(){
    if(this.state!=='playing'||this.busy)return;
    const mv=this.findAnyMove();
    if(!mv){ this.doShuffle(); return; }
    this.hintMove=mv; this.hintT=2.5; sfxHint();
  },
  doShuffle(){
    if(this.state!=='playing'||this.busy)return;
    let guard=20;
    do{
      for(let r=0;r<this.rows;r++)for(let c=0;c<this.cols;c++) if(this.grid[r][c]&&!this.grid[r][c].dying) this.grid[r][c].charIdx=this.randChar();
      guard--;
    } while(guard>0&&(this.findMatches().cells.length>0||!this.findAnyMove()));
    sfxShuffle(); this.selected=null; this.hintMove=null;
    showHint('Перемешали! 🔀',1500);
  },
  checkEnd(){
    const won=this.goals.every(g=>g.got>=g.need);
    if(won){
      this.state='complete'; sfxWin(); FX.spawnConfetti();
      const ratio=this.totalMoves>0?this.moves/this.totalMoves:0;
      const stars=ratio>=.45?3:(ratio>=.22?2:1);
      setTimeout(()=>{ showWin('match3',this.level,stars,`Счёт: ${this.score}`); },900);
      return true;
    }
    if(!this.findAnyMove()) this.doShuffle();
    if(this.moves<=0){
      this.state='lost'; sfxLose();
      const left=this.goals.filter(g=>g.got<g.need).map(g=>`${Math.floor(g.need-g.got)} ещё`).join(', ');
      setTimeout(()=>{ showLose('match3',this.level,left?`Осталось собрать: ${left}`:''); },600);
      return true;
    }
    return false;
  },
  update(dt){
    if(this.state!=='playing'&&this.state!=='complete'&&this.state!=='lost') return;
    if(this.dyingTiles.length>0){
      let allDone=true;
      for(let i=this.dyingTiles.length-1;i>=0;i--){
        const d=this.dyingTiles[i]; d.t+=dt;
        if(d.t>=d.maxT){
          if(this.grid[d.r]&&this.grid[d.r][d.c]&&this.grid[d.r][d.c].charIdx===d.charIdx) this.grid[d.r][d.c]=null;
          const ch=CHARACTERS[d.charIdx];
          FX.burstParticles(this.baseX+d.c*this.CELL+this.CELL/2,this.baseY+d.r*this.CELL+this.CELL/2,ch,8,.9);
          this.dyingTiles.splice(i,1);
        } else allDone=false;
      }
      if(allDone&&this.dyingTiles.length===0){ this.applyGravity(); this.matchDelay=.35; }
    } else if(this.matchDelay>0) this.matchDelay-=dt;

    let allSettled=true;
    for(let r=0;r<this.rows;r++){
      for(let c=0;c<this.cols;c++){
        const t=this.grid[r]&&this.grid[r][c];
        if(!t){ allSettled=false; continue; }
        if(t.dying) continue;
        if(t.delay>0){ t.delay-=dt; allSettled=false; continue; }
        const targetY=r*this.CELL;
        if(Math.abs(t.y-targetY)>1){ t.y+=(targetY-t.y)*Math.min(1,dt*15); allSettled=false; }
        else t.y=targetY;
      }
    }

    if(this.busy&&this.dyingTiles.length===0&&allSettled&&this.matchDelay<=0){
      const m=this.findMatches();
      if(m.cells.length>0){ this.combo++; this.removeMatches(m); }
      else { this.busy=false; if(this.state==='playing') this.checkEnd(); }
    }
    if(this.hintT>0){ this.hintT-=dt; if(this.hintT<=0) this.hintMove=null; }
    for(const g of this.goals) if(g.pulse>0) g.pulse-=dt*2.2;
  },
  drawGoals(t){
    const n=this.goals.length;
    const gw=Math.min(90,W/(n+1));
    const totalW=gw*n;
    const startX=(W-totalW)/2;
    const y=64;
    this.goalPos=[];
    for(let i=0;i<n;i++){
      const g=this.goals[i];
      const ch=CHARACTERS[g.charIdx];
      const cx=startX+gw*i+gw/2;
      this.goalPos.push({x:cx,y});
      const done=g.got>=g.need;
      const pulse=1+Math.max(0,g.pulse)*.25;
      ctx.save(); ctx.translate(cx,y); ctx.scale(pulse,pulse);
      ctx.fillStyle=ch.color; ctx.globalAlpha=.9;
      ctx.beginPath(); ctx.arc(0,0,gw*.32,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(0,0,gw*.32,0,TAU); ctx.stroke();
      if(done){ ctx.globalAlpha=.5; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,gw*.32,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
      drawCharAt(g.charIdx,gw*.5,t);
      ctx.restore();
      ctx.fillStyle=done?'#3a7a3a':'#7a3d1a';
      ctx.font=`bold ${Math.round(gw*.22)}px system-ui,-apple-system,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(done?'✓':`${g.got}/${g.need}`, cx, y+gw*.36);
      ctx.textAlign='start'; ctx.textBaseline='alphabetic';
    }
  },
  drawDyingTile(d,t){
    const cx=this.baseX+d.c*this.CELL+this.CELL/2;
    const cy=this.baseY+d.r*this.CELL+this.CELL/2;
    const p=d.t/d.maxT;
    let scale,alpha,glow;
    if(p<.58){ const ph=p/.58; scale=1+Math.sin(ph*Math.PI*4)*.14; alpha=1; glow=.35+Math.sin(ph*Math.PI*3)*.35; }
    else { const q=(p-.58)/.42; scale=1-q*.92; alpha=1-q; glow=1-q; }
    const ch=CHARACTERS[d.charIdx];
    ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);
    if(glow>.02){
      ctx.save(); ctx.globalAlpha=alpha*glow*.55;
      const rad=this.CELL*.7;
      const gg=ctx.createRadialGradient(0,0,this.CELL*.3,0,0,rad);
      gg.addColorStop(0,ch.particles); gg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,rad,0,TAU); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha=alpha;
    const tileGrad=ctx.createLinearGradient(0,-this.CELL/2,0,this.CELL/2);
    tileGrad.addColorStop(0,'#fffdf5'); tileGrad.addColorStop(1,'#f0e2c8');
    ctx.fillStyle=tileGrad;
    roundRect(ctx,-this.CELL*.46,-this.CELL*.46,this.CELL*.92,this.CELL*.92,this.CELL*.18); ctx.fill();
    ctx.strokeStyle=ch.color; ctx.lineWidth=2.5;
    roundRect(ctx,-this.CELL*.46,-this.CELL*.46,this.CELL*.92,this.CELL*.92,this.CELL*.18); ctx.stroke();
    drawCharAt(d.charIdx,this.CELL*.8,t);
    if(glow>.15&&p<.58){
      ctx.globalAlpha=alpha*glow;
      for(let i=0;i<5;i++){
        const a=(i/5)*TAU+t*2;
        const rr=this.CELL*(.42+Math.sin(t*6+i)*.08);
        ctx.fillStyle='#fff8c0'; ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,2.5,0,TAU); ctx.fill();
      }
    }
    ctx.restore(); ctx.globalAlpha=1;
  },
  render(t){
    ctx.save();
    FX.applyShake();
    const th=this.theme;
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,th.sky[0]); bg.addColorStop(.55,th.sky[1]); bg.addColorStop(1,th.sky[2]);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    this.drawGoals(t);
    const gw=this.CELL*this.cols, gh=this.CELL*this.rows;
    ctx.fillStyle='rgba(255,255,255,.35)'; roundRect(ctx,this.baseX-8,this.baseY-8,gw+16,gh+16,18); ctx.fill();
    // шахматная подсветка клеток
    for(let r=0;r<this.rows;r++)for(let c=0;c<this.cols;c++){
      if((r+c)%2===0) continue;
      ctx.fillStyle='rgba(255,255,255,.18)';
      roundRect(ctx,this.baseX+c*this.CELL+2,this.baseY+r*this.CELL+2,this.CELL-4,this.CELL-4,this.CELL*.16); ctx.fill();
    }
    for(let r=0;r<this.rows;r++){
      for(let c=0;c<this.cols;c++){
        const tile=this.grid[r]&&this.grid[r][c];
        if(!tile||tile.dying) continue;
        if(tile.delay>0) continue;
        const cx=this.baseX+c*this.CELL+this.CELL/2;
        const cy=this.baseY+tile.y+this.CELL/2;
        const isSel=this.selected&&this.selected.r===r&&this.selected.c===c;
        const isHint=this.hintMove&&this.hintMove.some(m=>m.r===r&&m.c===c);
        const ch=CHARACTERS[tile.charIdx];
        const tileGrad=ctx.createLinearGradient(cx,cy-this.CELL/2,cx,cy+this.CELL/2);
        tileGrad.addColorStop(0,'#fffdf5'); tileGrad.addColorStop(1,'#f0e2c8');
        ctx.fillStyle=tileGrad; roundRect(ctx,cx-this.CELL*.46,cy-this.CELL*.46,this.CELL*.92,this.CELL*.92,this.CELL*.18); ctx.fill();
        ctx.strokeStyle=ch.color; ctx.lineWidth=isSel||isHint?3.5:2;
        roundRect(ctx,cx-this.CELL*.46,cy-this.CELL*.46,this.CELL*.92,this.CELL*.92,this.CELL*.18); ctx.stroke();
        if(isSel){ const pulse=.3+Math.sin(t*8)*.2; ctx.fillStyle=`rgba(255,215,100,${pulse})`; roundRect(ctx,cx-this.CELL*.52,cy-this.CELL*.52,this.CELL*1.04,this.CELL*1.04,this.CELL*.22); ctx.fill(); }
        if(isHint){ const pulse=.3+Math.sin(t*10)*.2; ctx.fillStyle=`rgba(255,120,90,${pulse})`; roundRect(ctx,cx-this.CELL*.52,cy-this.CELL*.52,this.CELL*1.04,this.CELL*1.04,this.CELL*.22); ctx.fill(); }
        ctx.save(); ctx.translate(cx,cy); drawCharAt(tile.charIdx,this.CELL*.8,t); ctx.restore();
      }
    }
    for(const d of this.dyingTiles) this.drawDyingTile(d,t);
    FX.draw(t);
    ctx.restore();
  }
};
