/* Голос гибрида: новый, но собранный из «музыкальных генов» родителей */
const SING_GENES=[   // wave: 0 sine, 1 triangle, 2 square, 3 sawtooth
  {wave:0, flt:200,  vib:0, dur:.20, oct:-24, base:5},  // 0 Бум-Бум
  {wave:2, flt:7000, vib:0, dur:.06, oct:0,   base:7},  // 1 Тик-Так
  {wave:2, flt:320,  vib:0, dur:.26, oct:-24, base:4},  // 2 Воббл
  {wave:1, flt:2200, vib:5, dur:.34, oct:0,   base:6},  // 3 Ля-Ля
  {wave:1, flt:900,  vib:2, dur:1.6, oct:-12, base:2},  // 4 Дуэт
  {wave:2, flt:4000, vib:0, dur:.14, oct:0,   base:5},  // 5 Струна
  {wave:0, flt:5000, vib:0, dur:.55, oct:12,  base:2},  // 6 Дзынь
  {wave:0, flt:6000, vib:6, dur:.30, oct:12,  base:4},  // 7 Свистун
  {wave:0, flt:6500, vib:9, dur:.12, oct:12,  base:8},  // 8 Крылатик
];
const BASS_IDX={'C2':0,'G2':3,'A2':4};
function parentNote(p,s){
  switch(p){
    case 2: return BASS_IDX[SONG.parts.bass.notes[s]]||null;
    case 3: return SONG.parts.melody.notes[s]||null;
    case 5: return SONG.parts.arp.notes[s]||null;
    case 6: return SONG.parts.bells.notes[s]||null;
    case 7: return SONG.parts.whistle.notes[s]||null;
    case 8: return SONG.parts.flutter.notes[s]||null;
    default: return null;
  }
}
function fuseSong(parts){
  let seed=17; for(const p of parts) seed=((seed*131)+p*7919+13)>>>0;
  const rng=mulberry32(seed);
  const g=parts.map(p=>SING_GENES[p]);
  const WAVES=['sine','triangle','square','sawtooth'];
  // ритм: объединение партий родителей + пара случайных «поворотов»
  const on=new Array(16).fill(false);
  for(const p of parts) for(const s of SING_HITS[p]) on[s]=true;
  let toggles=1+Math.floor(rng()*2);
  while(toggles-->0){ const s=1+Math.floor(rng()*15); on[s]=!on[s]; }
  on[0]=true;
  // тембр — строго между родителями
  const wave=WAVES[Math.min(3,Math.round(g.reduce((s,x)=>s+x.wave,0)/g.length))];
  const flt=Math.min(12000,Math.round(Math.sqrt(g.reduce((s,x)=>s*Math.max(150,x.flt),1))*1.3));
  const vib=Math.max(...g.map(x=>x.vib))+(rng()<0.5?1:0);
  const dur=clamp(g.reduce((s,x)=>s+x.dur,0)/g.length*0.9,.12,1.2);
  const oct=Math.round(g.reduce((s,x)=>s+x.oct,0)/g.length);
  // мелодия: ноты «между» родителями + лёгкая вариация
  const notes={}; let last=clamp(Math.round(g.reduce((s,x)=>s+x.base,0)/g.length),1,9);
  for(let s=0;s<16;s++){
    if(!on[s]) continue;
    const cand=[];
    for(const p of parts){ const n=parentNote(p,s); if(n!=null) cand.push(n); }
    let idx=cand.length?Math.round(cand.reduce((a,b)=>a+b,0)/cand.length):last+(rng()<0.5?-1:1)*(rng()<0.7?1:2);
    idx=clamp(idx,0,10);
    notes[s]=idx; last=idx;
  }
  return {notes, wave, flt, vib, dur, oct, vol:.22};
}

const singers={
  state:'idle', monsters:[], coins:0, selected:null,
  master:null, delay:null, noiseBuf:null,
  music:{playing:false, stepIdx:0, next:0, t0:0, timer:null},
  _lastStep:-1, coinsDirty:false, mixMode:false, mixSel:null, mixAnim:null,

  start(){
    currentGame='singers';
    this.state='playing';
    this.selected=null; this._lastStep=-1; this.coinsDirty=false;
    this.coins=save.sm.coins;
    this.monsters=save.sm.placed.map(p=>{
      const parts=(p.p&&p.p.length)?p.p.slice():[p.t];
      return {parts, song:parts.length>1?fuseSong(parts):null, spot:p.s, muted:!!p.m, detune:rnd(-7,7), popT:0, wigT:0, badgeT:0};
    });
    this.music.playing=false;
    if(this.music.timer){ clearInterval(this.music.timer); this.music.timer=null; }
    ambient.set(THEMES[0]);
    elHud.classList.remove('hidden');
    elHintBtn.classList.remove('hidden');
    elHintBtn.textContent='🧪';
    elShuffleBtn.classList.remove('hidden');
    elShuffleBtn.textContent='🎵';
    elOverlay.classList.add('hidden');
    elMenu.classList.add('hidden');
    elShop.classList.remove('hidden');
    this.refreshShop();
    this.syncHud();
    if(this.monsters.length===0){
      // дарим первого монстрика — концерт начинается сразу
      this.monsters.push({parts:[0], spot:4, muted:false, detune:rnd(-7,7), popT:.5, wigT:0, badgeT:0});
      this.saveState(); persist();
      this.startMusic();
      showHint('Дарю тебе Бум-Бума! 🎁 Покупай монстров внизу и ставь на сцену 👇',4500);
    } else {
      this.startMusic();
      showHint('Твой хор снова здесь! 🎶',2500);
    }
  },
  syncHud(){ setHudProgress(`🪙 ${this.coins} · Монстров: ${this.monsters.length}/${SPOTS.length}`); },
  saveState(){ save.sm.coins=this.coins; save.sm.placed=this.monsters.map(x=>({p:x.parts,s:x.spot,m:x.muted?1:0})); },

  /* ---------- АУДИО ---------- */
  ensureAudio(){
    const a=ac(); if(!a) return;
    if(this.master) return;
    this.master=a.createGain(); this.master.gain.value=muted?0:0.55;
    const comp=a.createDynamicsCompressor();
    this.master.connect(comp); comp.connect(a.destination);
    this.delay=a.createDelay(1); this.delay.delayTime.value=60/SONG.BPM*0.75;
    const fb=a.createGain(); fb.gain.value=0.28;
    const flt=a.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=1600;
    this.delay.connect(fb); fb.connect(flt); flt.connect(this.delay);
    const dOut=a.createGain(); dOut.gain.value=0.5;
    this.delay.connect(dOut); dOut.connect(this.master);
  },
  getNoise(a){
    if(!this.noiseBuf){
      this.noiseBuf=a.createBuffer(1,a.sampleRate*0.5|0,a.sampleRate);
      const d=this.noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    return this.noiseBuf;
  },
  tone(o){
    const a=ac(); if(!a||!this.master) return;
    const osc=a.createOscillator(); osc.type=o.type||'sine';
    if(o.slideFrom){ osc.frequency.setValueAtTime(o.slideFrom,o.t); osc.frequency.exponentialRampToValueAtTime(o.f,o.t+0.09); }
    else osc.frequency.setValueAtTime(o.f,o.t);
    if(o.detune) osc.detune.setValueAtTime(o.detune,o.t);
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001,o.t);
    g.gain.exponentialRampToValueAtTime(o.vol,o.t+(o.attack||0.015));
    g.gain.exponentialRampToValueAtTime(0.0008,o.t+o.dur);
    let node=osc;
    if(o.flt){ const bq=a.createBiquadFilter(); bq.type='lowpass'; bq.frequency.setValueAtTime(o.flt,o.t); osc.connect(bq); node=bq; }
    node.connect(g); g.connect(this.master);
    if(o.send) g.connect(this.delay);
    if(o.vib){ const l=a.createOscillator(), lg=a.createGain(); l.frequency.value=5.5; lg.gain.value=o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(o.t); l.stop(o.t+o.dur+0.05); }
    osc.start(o.t); osc.stop(o.t+o.dur+0.05);
  },
  noiseHit(o){
    const a=ac(); if(!a||!this.master) return;
    const src=a.createBufferSource(); src.buffer=this.getNoise(a);
    const bq=a.createBiquadFilter(); bq.type=o.type||'highpass'; bq.frequency.value=o.freq;
    const g=a.createGain();
    g.gain.setValueAtTime(o.vol,o.t);
    g.gain.exponentialRampToValueAtTime(0.0008,o.t+o.dur);
    src.connect(bq); bq.connect(g); g.connect(this.master);
    if(o.send) g.connect(this.delay);
    src.start(o.t); src.stop(o.t+o.dur+0.02);
  },
  kick(t){
    const a=ac(); if(!a||!this.master) return;
    const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.14);
    const g=a.createGain();
    g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.2);
  },
  scaleF(i){ return 130.81*Math.pow(2,SONG.scale[i]/12); },
  schedPart(m, step, t){
    if(m.muted) return;
    if(m.parts.length===1){ this.schedOne(m.parts[0], m, step, t); return; }
    this.schedFuse(m, step, t);
  },
  schedFuse(m, step, t){
    const song=m.song; if(!song) return;
    const idx=song.notes[step]; if(idx==null) return;
    const f=this.scaleF(idx)*Math.pow(2,song.oct/12);
    // основной голос + подголосок — новый сплавленный тембр
    this.tone({t, f, dur:song.dur, type:song.wave, vol:song.vol, flt:song.flt, vib:song.vib, send:true, detune:m.detune});
    this.tone({t, f:f*1.004, dur:song.dur*0.75, type:song.wave, vol:song.vol*0.35, flt:song.flt, send:true, detune:(m.detune||0)+9});
  },
  schedOne(type, m, step, t){
    const d=m.detune;
    switch(type){
      case 0: if(step===0||step===8) this.kick(t); break;
      case 1:
        if(step===2||step===6||step===10||step===14) this.noiseHit({t,dur:.05,vol:.12,freq:7500});
        if(step===4||step===12) this.noiseHit({t,dur:.1,vol:.2,type:'bandpass',freq:1500});
        break;
      case 2:{ const n=SONG.parts.bass.notes[step]; if(n) this.tone({t,f:noteF(n),dur:.26,type:'square',vol:.2,flt:320,detune:d}); break; }
      case 3:{ const n=SONG.parts.melody.notes[step]; if(n!=null) this.tone({t,f:this.scaleF(n),dur:.34,type:'triangle',vol:.2,vib:5,flt:2200,send:true,detune:d}); break; }
      case 4:{ const ch=SONG.parts.pad.chords[step];
        if(ch){ const dur=8*(60/SONG.BPM/2)*0.95;
          ch.forEach(nm=>this.tone({t,f:noteF(nm),dur,type:'triangle',vol:.05,attack:.25,flt:900,detune:d})); }
        break; }
      case 5:{ const n=SONG.parts.arp.notes[step]; if(n!=null) this.tone({t,f:this.scaleF(n),dur:.14,type:'square',vol:.07,send:true,detune:d}); break; }
      case 6:{ const n=SONG.parts.bells.notes[step];
        if(n!=null){ const f=this.scaleF(n);
          this.tone({t,f,dur:.7,type:'sine',vol:.09,send:true,detune:d});
          this.tone({t,f:f*2.76,dur:.35,type:'sine',vol:.028,send:true}); }
        break; }
      case 7:{ const n=SONG.parts.whistle.notes[step];
        if(n!=null){ const f=this.scaleF(n); this.tone({t,f,dur:.3,type:'sine',vol:.11,slideFrom:f*0.94,vib:6,send:true,detune:d}); }
        break; }
      case 8:{ const n=SONG.parts.flutter.notes[step];
        if(n!=null){
          const f=this.scaleF(n);
          this.tone({t,f,dur:.11,type:'sine',vol:.08,send:true,detune:d,vib:9});
          this.tone({t:t+.07,f:this.scaleF(n<10?n+1:n-1),dur:.11,type:'sine',vol:.07,send:true,detune:d,vib:9});
        }
        break; }
    }
  },
  startMusic(){
    this.ensureAudio(); if(!this.master||this.music.playing) return;
    const a=ac(); if(!a) return;
    this.music.playing=true;
    this.music.stepIdx=0;
    this.music.t0=a.currentTime+0.08;
    this.music.next=this.music.t0;
    this.music.timer=setInterval(()=>this.tick(),30);
    elShuffleBtn.textContent='⏸';
  },
  stopMusic(){
    if(this.music.timer){ clearInterval(this.music.timer); this.music.timer=null; }
    this.music.playing=false;
    if(currentGame==='singers') elShuffleBtn.textContent='🎵';
  },
  toggleMusic(){ this.music.playing ? this.stopMusic() : this.startMusic(); },
  tick(){
    const a=ac(); if(!a) return;
    const sd=60/SONG.BPM/2;
    const ahead = document.hidden ? 1.4 : 0.12; // в фоне планируем дальше, чтобы музыка не заикалась
    while(this.music.next < a.currentTime + ahead){
      const step=this.music.stepIdx, t=this.music.next;
      for(const m of this.monsters){
        try{ this.schedPart(m, step, t); }catch(e){ /* один монстр не должен ломать всю песню */ }
      }
      this.music.stepIdx=(step+1)%SONG.STEPS;
      this.music.next+=sd;
      if(this.music.stepIdx===0 && this.monsters.length){
        this.coins+=this.monsters.length*3;
        this.saveState(); persist();
        this.coinsDirty=true;
      }
    }
  },

  /* ---------- ИГРА ---------- */
  geo(){ const rx=Math.min(W*0.44,430); return {cx:W/2, cy:H*0.52, rx, ry:rx*0.5}; },
  spotPx(i){
    const g=this.geo(), sp=SPOTS[i];
    return {x:g.cx+sp.x*g.rx*0.78, y:g.cy+sp.y*g.ry*0.86, sc:sp.sc, r:62*sp.sc};
  },
  nearestFreeSpot(px,py){
    let best=-1, bd=1e9;
    for(let i=0;i<SPOTS.length;i++){
      if(this.monsters.some(m=>m.spot===i)) continue;
      const p=this.spotPx(i);
      const d=Math.hypot(px-p.x,py-p.y);
      if(d<p.r+34 && d<bd){ bd=d; best=i; }
    }
    return best;
  },
  selectCard(i){
    if(this.state!=='playing') return;
    if(this.selected===i){ this.selected=null; this.refreshShop(); return; }
    if(this.coins<SING_TYPES[i].cost){ sfxError(); showHint('Не хватает монет! Монстры поют и приносят 🪙',2200); return; }
    this.selected=i; sfxClick(); this.refreshShop();
    showHint('Теперь выбери свободное место на сцене! 👆',2500);
  },
  place(i){
    const type=this.selected, cost=SING_TYPES[type].cost;
    if(this.coins<cost){ sfxError(); this.selected=null; this.refreshShop(); return; }
    this.coins-=cost;
    const m={parts:[type], spot:i, muted:false, detune:rnd(-7,7), popT:.35, wigT:0, badgeT:0};
    this.monsters.push(m);
    this.selected=null;
    this.saveState(); persist();
    sfxBuy();
    const p=this.spotPx(i);
    FX.popup(p.x,p.y-64,SING_TYPES[type].say+'!',SING_TYPES[type].col,18);
    FX.burstParticles(p.x,p.y,{particles:'#ffd166',shape:'star',dir:0},8,.8);
    this.syncHud(); this.refreshShop(); updateMenuProg();
    if(!this.music.playing) this.startMusic();
    showHint(SING_TYPES[type].name+' вступает в хор! '+SING_TYPES[type].say,2200);
  },
  sell(m){
    const refund=Math.floor(m.parts.reduce((s,p)=>s+SING_TYPES[p].cost,0)*0.6);
    this.coins+=refund;
    this.monsters=this.monsters.filter(x=>x!==m);
    this.saveState(); persist();
    sfxSell();
    const p=this.spotPx(m.spot);
    FX.popup(p.x,p.y-40,'+'+refund+' 🪙','#7a5a1a',17);
    this.syncHud(); this.refreshShop(); updateMenuProg();
  },
  handleClick(px,py){
    if(this.state!=='playing') return;
    for(const m of this.monsters){
      if(m.badgeT>0){
        const p=this.spotPx(m.spot);
        if(Math.hypot(px-(p.x+26*p.sc),py-(p.y-80*p.sc))<17){ this.sell(m); return; }
        if(Math.hypot(px-(p.x-26*p.sc),py-(p.y-80*p.sc))<17){
          m.muted=!m.muted;
          this.saveState(); persist();
          sfxClick();
          FX.popup(p.x,p.y-110*p.sc, m.muted?'Молчит 🤫':'Опять поёт! 🎵','#5a3a7a',15);
          m.badgeT=3;
          return;
        }
      }
    }
    if(this.selected!=null){
      const i=this.nearestFreeSpot(px,py);
      if(i>=0){ this.place(i); return; }
      showHint('Выбери свободный кружок на сцене!',1800);
      return;
    }
    if(this.mixMode){
      const m=this.monsterAt(px,py);
      if(!m) return;
      if(!this.mixSel){ this.mixSel=m; m.wigT=.7; sfxClick(); showHint('Теперь выбери ВТОРОГО монстра 🧪',2500); return; }
      if(this.mixSel===m){ this.mixSel=null; sfxClick(); showHint('Выбор сброшен. Выбери первого монстра',2000); return; }
      this.doMix(this.mixSel,m); return;
    }
    const m=this.monsterAt(px,py);
    if(m){
      m.wigT=.7; m.badgeT=3; sfxPop();
      const p=this.spotPx(m.spot);
      FX.popup(p.x,p.y-66,SING_TYPES[m.parts[0]].say,SING_TYPES[m.parts[0]].col,16);
      return;
    }
    showHint('Выбери монстрика в магазине внизу 👇',2200);
  },
  monsterAt(px,py){
    for(let i=this.monsters.length-1;i>=0;i--){
      const m=this.monsters[i], p=this.spotPx(m.spot);
      if(Math.hypot(px-p.x,py-p.y)<p.r) return m;
    }
    return null;
  },
  startMix(){
    if(this.mixAnim){ showHint('Микс уже кипит! ✨',1500); return; }
    if(this.mixMode){ this.mixMode=false; this.mixSel=null; this.refreshShop(); showHint('Режим смешивания выключен',1600); return; }
    if(this.monsters.length<2){ sfxError(); showHint('Нужно хотя бы два монстра на сцене!',2200); return; }
    this.mixMode=true; this.mixSel=null; this.selected=null; this.refreshShop();
    sfxClick();
    showHint('🧪 Выбери ПЕРВОГО монстра для смешивания!',3000);
  },
  doMix(a,b){
    const parts=[...a.parts, ...b.parts];
    if(parts.length>3){ sfxError(); this.mixSel=null; showHint('Слишком много голосов! Максимум 3 🎵',2200); return; }
    this.monsters=this.monsters.filter(x=>x!==a&&x!==b);
    this.mixSel=null;
    this.mixAnim={t:0, dur:1.6, spots:[a.spot,b.spot], parts, spot:a.spot, song:fuseSong(parts)};
    this.saveState(); persist();
    sfxMix();
    const pa=this.spotPx(a.spot), pb=this.spotPx(b.spot);
    FX.burstParticles(pa.x,pa.y,{particles:'#ffd166',shape:'star',dir:0},10,1);
    FX.burstParticles(pb.x,pb.y,{particles:'#ffd166',shape:'star',dir:0},10,1);
  },
  refreshShop(){
    for(let i=0;i<SING_TYPES.length;i++){
      const card=document.getElementById('scard'+i);
      if(!card) continue;
      card.classList.toggle('poor', this.coins<SING_TYPES[i].cost);
      card.classList.toggle('sel', this.selected===i);
    }
  },
  update(dt){
    if(this.state!=='playing') return;
    if(this.master) this.master.gain.value=muted?0:0.55;
    for(const m of this.monsters){ if(m.popT>0)m.popT-=dt; if(m.wigT>0)m.wigT-=dt; if(m.badgeT>0)m.badgeT-=dt; }
    if(this.music.playing){
      const a=ac();
      if(a){
        const sd=60/SONG.BPM/2;
        const st=Math.floor((a.currentTime-this.music.t0)/sd);
        if(st!==this._lastStep){
          this._lastStep=st;
          const s=((st%SONG.STEPS)+SONG.STEPS)%SONG.STEPS;
          for(const m of this.monsters){
            const hits = m.parts.length===1 ? SING_HITS[m.parts[0]] : (m.song?Object.keys(m.song.notes).map(Number):[]);
            if(hits.includes(s)){
              m.popT=.28;
              const p=this.spotPx(m.spot);
              FX.particles.push({x:p.x+rnd(-14,14),y:p.y-52*p.sc,vx:rnd(-8,8),vy:-46,life:1.1,maxLife:1.1,size:15,color:SING_TYPES[m.parts[0]].col,shape:'note',rotation:rnd(-.3,.3),rotSpeed:0,gravity:-14});
            }
          }
        }
      }
    }
    if(this.mixAnim){
      const ma=this.mixAnim; ma.t+=dt;
      const p1=this.spotPx(ma.spots[0]), p2=this.spotPx(ma.spots[1]);
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      if(Math.random()<0.4) FX.particles.push({x:mx+rnd(-46,46),y:my+rnd(-34,26),vx:rnd(-15,15),vy:rnd(-60,-20),life:.7,maxLife:.7,size:rnd(3,6),color:'#fff3b0',shape:'star',rotation:rnd(0,TAU),rotSpeed:rnd(-8,8),gravity:-40});
      if(ma.t>=ma.dur){
        const m={parts:ma.parts, song:ma.song, spot:ma.spot, detune:rnd(-7,7), popT:.5, wigT:0, badgeT:0};
        this.monsters.push(m);
        const p=this.spotPx(ma.spot);
        FX.popup(p.x,p.y-72,hybridName(ma.parts)+' ✨','#7a4fd0',19);
        FX.burstParticles(p.x,p.y,{particles:'#e8d6ff',shape:'star',dir:0},12,1.1);
        sfxBuy();
        this.mixAnim=null; this.mixMode=false;
        this.saveState(); persist();
        this.syncHud();
        showHint('Получился '+hybridName(ma.parts)+' — со своим собственным новым голосом! 🎶',3400);
      }
    }
    if(this.coinsDirty){ this.coinsDirty=false; this.syncHud(); this.refreshShop(); updateMenuProg(); }
  },
  render(t){
    ctx.save(); FX.applyShake();
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#a8e0ff'); bg.addColorStop(.55,'#d8f4e0'); bg.addColorStop(1,'#b8e8a0');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    ctx.fillStyle='rgba(255,230,140,.25)'; ctx.beginPath(); ctx.arc(W-70,84,52,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,235,150,.95)'; ctx.beginPath(); ctx.arc(W-70,84,32,0,TAU); ctx.fill();
    const g=this.geo();
    ctx.fillStyle='#5a9a4a'; ctx.beginPath(); ctx.ellipse(g.cx,g.cy+16,g.rx,g.ry,0,0,TAU); ctx.fill();
    const gg=ctx.createLinearGradient(0,g.cy-g.ry,0,g.cy+g.ry);
    gg.addColorStop(0,'#8ed468'); gg.addColorStop(1,'#6cb84e');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(g.cx,g.cy,g.rx,g.ry,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';
    for(let i=0;i<8;i++){ const a=i/8*TAU+0.4;
      ctx.beginPath(); ctx.arc(g.cx+Math.cos(a)*g.rx*0.88, g.cy+Math.sin(a)*g.ry*0.88, 3,0,TAU); ctx.fill(); }
    for(let i=0;i<SPOTS.length;i++){
      if(this.monsters.some(m=>m.spot===i)) continue;
      const p=this.spotPx(i), sel=this.selected!=null;
      ctx.setLineDash([7,7]);
      ctx.strokeStyle=sel?`rgba(255,183,3,${.55+.35*Math.sin(t*6)})`:'rgba(255,255,255,.6)';
      ctx.lineWidth=sel?3.5:2.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,46*p.sc,0,TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if(this.mixMode){
      for(const mm of this.monsters){
        const p=this.spotPx(mm.spot), sel=mm===this.mixSel;
        ctx.setLineDash([5,5]);
        ctx.strokeStyle=sel?'#ffffff':`rgba(255,183,3,${.5+.4*Math.sin(t*7)})`;
        ctx.lineWidth=sel?4.5:3;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    if(this.mixAnim){
      const ma=this.mixAnim, q=Math.min(1,ma.t/ma.dur);
      for(const sp of ma.spots){
        const p=this.spotPx(sp);
        ctx.save(); ctx.translate(p.x,p.y-30); ctx.rotate(q*10); ctx.globalAlpha=1-q;
        ctx.font=`900 ${30+q*46}px system-ui,sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('✨',0,0);
        ctx.restore();
      }
      const p1=this.spotPx(ma.spots[0]), p2=this.spotPx(ma.spots[1]);
      ctx.save(); ctx.globalAlpha=.85;
      ctx.font=`900 ${26+Math.sin(t*10)*7}px system-ui,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🧪',(p1.x+p2.x)/2,(p1.y+p2.y)/2-40);
      ctx.restore();
    }
    for(let i=0;i<SPOTS.length;i++){
      const m=this.monsters.find(mm=>mm.spot===i); if(!m) continue;
      const p=this.spotPx(i);
      let bob=0, sx=1, sy=1, rot=Math.sin(t*1.6+m.spot*1.7)*0.035;
      if(this.music.playing){
        const a=ac();
        if(a){ const sd=60/SONG.BPM/2;
          let sp=((a.currentTime-this.music.t0)/sd)%2; if(sp<0)sp+=2;
          bob=-Math.abs(Math.sin(sp*Math.PI))*5; }
      }
      if(m.popT>0){ const q=Math.max(0,m.popT)/.28; bob-=Math.sin((1-q)*Math.PI)*10; sx=1+q*.15; sy=1-q*.1; }
      if(m.wigT>0) rot+=Math.sin(m.wigT*28)*.16*(m.wigT/.7);
      ctx.save(); ctx.translate(p.x,p.y+bob); ctx.rotate(rot); ctx.scale(p.sc*sx,p.sc*sy);
      if(m.parts.length===1) SING_TYPES[m.parts[0]].draw(ctx,0.95,t);
      else ctx.drawImage(hybridSprite(m.parts),-70,-70,140,140);
      ctx.restore();
      if(m.badgeT>0){
        const a2=m.badgeT<0.4?m.badgeT/0.4:1;
        const btns=[[p.x-26*p.sc, m.muted?'🔇':'🔊', '#4cc9f0'],[p.x+26*p.sc, '✖', '#ff5a5f']];
        for(const [bx2, icon, ring] of btns){
          ctx.save(); ctx.globalAlpha=a2;
          ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx2,p.y-80*p.sc,17,0,TAU); ctx.fill();
          ctx.strokeStyle=ring; ctx.lineWidth=2.5; ctx.stroke();
          ctx.font='900 15px system-ui,sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillStyle='#3a3a3a'; ctx.fillText(icon,bx2,p.y-80*p.sc+1);
          ctx.restore();
        }
      } else if(m.muted){
        ctx.save(); ctx.globalAlpha=.8;
        ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(p.x+42*p.sc,p.y-56*p.sc,12,0,TAU); ctx.fill();
        ctx.strokeStyle='#4cc9f0'; ctx.lineWidth=2; ctx.stroke();
        ctx.font='900 13px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🔇',p.x+42*p.sc,p.y-56*p.sc+1);
        ctx.restore();
      }
    }
    FX.draw(t);
    ctx.restore();
  }
};

/* Музыка сама ставится на паузу, когда вкладка уходит в фон */
document.addEventListener('visibilitychange',()=>{
  if(currentGame!=='singers') return;
  if(document.hidden){
    if(singers.music.playing){ singers._resumeOnShow=true; singers.stopMusic(); }
  } else if(singers._resumeOnShow){
    singers._resumeOnShow=false;
    singers.startMusic();
  }
});

function buildShopDOM(){
  const wrap=document.getElementById('shop-cards');
  if(!wrap) return;
  SING_TYPES.forEach((st,i)=>{
    const b=document.createElement('button');
    b.className='shop-card'; b.id='scard'+i;
    const cv=document.createElement('canvas'); cv.width=112; cv.height=112;
    const cc=cv.getContext('2d');
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=st.name;
    const pr=document.createElement('div'); pr.className='pr'; pr.textContent='🪙 '+st.cost;
    b.appendChild(cv); b.appendChild(nm); b.appendChild(pr);
    b.addEventListener('click',()=>{ ac(); singers.selectCard(i); });
    wrap.appendChild(b);
    cc.setTransform(2,0,0,2,0,0);
    cc.translate(28,34); cc.scale(0.5,0.5);
    st.draw(cc,1,1.2);
  });
}

const LB={
  ready:false, loading:null, err:null,
  playerName(){ try{ return localStorage.getItem('kids_lb_name')||''; }catch(e){ return ''; } },
  setPlayerName(n){ try{ localStorage.setItem('kids_lb_name',n); }catch(e){} },

  localBoard(){ try{ return JSON.parse(localStorage.getItem('kids_lb_local')||'[]'); }catch(e){ return []; } },

    try{ localStorage.setItem('kids_lb_local', JSON.stringify(b.slice(0,10))); }catch(e){}
  },
  ensureFirebase(){
    if(this.ready) return Promise.resolve(true);
    if(!LB_CONFIG) return Promise.resolve(false);
    if(this.loading) return this.loading;
    this.loading=new Promise(res=>{
      const s1=document.createElement('script');
      s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
      s1.onload=()=>{
        const s2=document.createElement('script');
        s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
        s2.onload=()=>{
          try{
            firebase.initializeApp(LB_CONFIG);
            this.db=firebase.database();
            this.ready=true; res(true);
          }catch(e){ this.err=String(e); res(false); }
        };
        s2.onerror=()=>{ this.err='cdn'; res(false); };
        document.head.appendChild(s2);
      };
      s1.onerror=()=>{ this.err='cdn'; res(false); };
      document.head.appendChild(s1);
    });
    return this.loading;
  },
  submit(name, stars, cb){
    if(!this.ready){ this.localSubmit(name,stars); cb(false); return; }
    try{
      this.db.ref('leaderboard').push(
        {name:String(name).slice(0,12), stars:Math.max(0,Math.min(999,stars|0)), ts:Date.now()},
        err=>{ if(err){ this.localSubmit(name,stars); cb(false); } else cb(true); }
      );
    }catch(e){ this.localSubmit(name,stars); cb(false); }
  },
  top(cb){
    if(!this.ready){ cb(this.localBoard(), false); return; }
    try{
      this.db.ref('leaderboard').orderByChild('stars').limitToLast(10).once('value',
        snap=>{
          const rows=[]; snap.forEach(ch=>{ const v=ch.val()||{}; rows.push({name:v.name||'???', stars:v.stars||0}); });
          rows.sort((a,b)=>b.stars-a.stars);

  },
  readPlays(cb){
    this.ensureFirebase().then(ok=>{
      if(!ok){ cb(null); return; }
      try{
        this.db.ref('stats/games').once('value', s=>cb(s.val()||{}), ()=>cb(null));
      }catch(e){ cb(null); }

  sendFeedback(text, cb){
    const clean=String(text||'').trim().slice(0,200);
    if(!clean){ cb(false); return; }
    const name=this.playerName()||'аноним';
    this.ensureFirebase().then(ok=>{

      try{
        this.db.ref('feedback').push(
          {name:String(name).slice(0,12), text:clean, stars:this.totalStars()||0, ts:Date.now()},
          err=>cb(!err)
        );
      }catch(e){ cb(false); }
    });
  },
  readStats(cb){
    this.ensureFirebase().then(ok=>{
      if(!ok){ cb(null); return; }

function savedLevelOf(game){
  return game==='mahjong'?save.mj.level:(game==='match3'?save.m3.level:getMini(game).level);
}
function starsOf(game, lvl){
  const st=game==='mahjong'?save.mj.stars:(game==='match3'?save.m3.stars:getMini(game).stars);
  return st[lvl]||0;
}

  if(game==='mahjong') return Math.max(save.mj.level+4, 10);
  if(game==='match3') return Math.max(save.m3.level+4, 10);
  if(game==='memory') return 2;
  if(game==='chapaev') return 4;
  return 3;
}

  elMenu.classList.add('hidden');

  }

const PUZZLE_SETS=[
  {grid:2, scene:0, ch:2},   // нерпа

  {grid:4, scene:2, ch:3},   // замок + принцесса

const puzzle={
  state:'idle', level:0, n:2, cells:[], sel:null, mistakes:0,
  boardX:0, boardY:0, boardS:0, off:null,
  start(level){
    currentGame='puzzle';
    this.state='playing';
    this.level=clamp(level,0,PUZZLE_SETS.length-1);
    const set=PUZZLE_SETS[this.level];
    this.n=set.grid;
    this.off=document.createElement('canvas'); this.off.width=600; this.off.height=600;
    const oc=this.off.getContext('2d');
    PUZZLE_SCENES[set.scene](oc,600,600);
    CHARACTERS[set.ch].draw(oc,2.4,1);
    const total=this.n*this.n;
    this.cells=[...Array(total).keys()];
    let guard=50;
    do{ shuffle(this.cells); guard--; }while(guard>0&&this.cells.every((v,i)=>v===i));
    this.sel=null; this.mistakes=0;
    miniUI(); ambient.set(THEMES[0]);
    this.syncHud();
    showHint('Меняй местами кусочки — собери картинку! 🧩',3500);
  },
  syncHud(){ setHudProgress(`Пазл ${this.level+1} · Ошибок: ${this.mistakes}`); },
  layout(){
    const size=clamp(Math.min(W-70,H-290),220,560);
    this.boardS=size;
    this.boardX=(W-size)/2;
    this.boardY=Math.max(105,105+(H-240-size)/2);
  },
  handleClick(px,py){
    if(this.state!=='playing') return;
    this.layout();
    const n=this.n, s=this.boardS/n;
    if(px<this.boardX||px>this.boardX+this.boardS||py<this.boardY||py>this.boardY+this.boardS) return;
    const cc=Math.floor((px-this.boardX)/s), rr=Math.floor((py-this.boardY)/s);
    const idx=rr*n+cc;
    if(this.sel==null){ this.sel=idx; sfxClick(); return; }
    if(this.sel===idx){ this.sel=null; return; }
    [this.cells[this.sel],this.cells[idx]]=[this.cells[idx],this.cells[this.sel]];
    this.sel=null; this.mistakes++; sfxPop(2);
    this.syncHud();
    if(this.cells.every((v,i)=>v===i)){
      this.state='complete'; sfxWin(); FX.spawnConfetti();
      const stars=this.mistakes<=2?3:(this.mistakes<=7?2:1);
      setTimeout(()=>showWin('puzzle',this.level,stars,`Ошибок: ${this.mistakes}`),900);
    }
  },
  update(){},
  render(t){
    this.layout();
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#fff4e0'); bg.addColorStop(1,'#ffe0c8');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    const n=this.n, s=this.boardS/n;
    ctx.fillStyle='rgba(255,255,255,.55)';
    roundRect(ctx,this.boardX-10,this.boardY-10,this.boardS+20,this.boardS+20,18); ctx.fill();
    for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++){
      const idx=r*n+cc, tile=this.cells[idx];
      const sx=(tile%n)*(600/n), sy=Math.floor(tile/n)*(600/n);
      const dx=this.boardX+cc*s, dy=this.boardY+r*s;
      ctx.drawImage(this.off,sx,sy,600/n,600/n,dx,dy,s,s);
      ctx.strokeStyle='rgba(120,80,40,.3)'; ctx.lineWidth=1.5;
      ctx.strokeRect(dx+.5,dy+.5,s-1,s-1);
      if(this.cells[idx]===idx&&this.state==='playing'){
        ctx.fillStyle='rgba(90,190,90,.85)';
        ctx.beginPath(); ctx.moveTo(dx+s-16,dy+1); ctx.lineTo(dx+s-1,dy+1); ctx.lineTo(dx+s-1,dy+16); ctx.closePath(); ctx.fill();
      }
      if(this.sel===idx){
        ctx.fillStyle=`rgba(255,183,3,${.28+.18*Math.sin(t*8)})`;

        ctx.strokeStyle='#ffb703'; ctx.lineWidth=4;

      }
    }
    ctx.strokeStyle=this.state==='complete'?'rgba(255,183,3,.95)':'rgba(200,160,110,.6)';
    ctx.lineWidth=this.state==='complete'?6:3;
    roundRect(ctx,this.boardX-10,this.boardY-10,this.boardS+20,this.boardS+20,18); ctx.stroke();
    FX.draw(t);
  }
};

const coloring={
  state:'idle', level:0, fills:[], selColor:PALETTE[0], wrongT:0,
  start(level){

    this.state='playing';

    this.syncHud();
    showHint('Выбери цвет снизу и раскрась картинку! 🎨',3500);
  },
  syncHud(){
    const left=this.fills.filter(f=>!f).length;
    setHudProgress(`Раскраска ${this.level+1} · Осталось: ${left}`);
  },
  handleClick(px,py){
    if(this.state!=='playing') return;
    // палитра
    const n=PALETTE.length, step=Math.min(54,(W-40)/n), total=step*n, x0=(W-total)/2, py2=H-48;
    if(py>py2-28&&py<py2+28){
      for(let i=0;i<n;i++){
        const px2=x0+step*i+step/2;
        if(Math.hypot(px-px2,py-py2)<27){ this.selColor=PALETTE[i]; sfxClick(); return; }
      }
    }
    // сцена
    const sc=COLOR_SCENES[this.level];
    const scale=clamp(Math.min((W-40)/600,(H-240)/600),0.3,1.4);
    const offX=(W-600*scale)/2, offY=Math.max(95,(H-200-600*scale)/2);
    const sx=(px-offX)/scale, sy=(py-offY)/scale;
    if(sx<0||sx>600||sy<0||sy>600) return;
    const pc=this.pickCtx;
    for(let i=sc.regions.length-1;i>=0;i--){
      pc.beginPath(); sc.regions[i].path(pc);
      if(pc.isPointInPath(sx,sy)){
        if(this.fills[i]!==this.selColor){
          this.fills[i]=this.selColor;
          sfxPop(1);
          FX.burstParticles(px,py,{particles:this.selColor,shape:'star',dir:0},6,.6);
          this.syncHud();

            this.state='complete'; sfxWin(); FX.spawnConfetti();

          }

      }
    }
  },
  update(){},
  render(t){
    const sc=COLOR_SCENES[this.level];
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#fff8ef'); bg.addColorStop(1,'#ffe8d8');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    const scale=clamp(Math.min((W-40)/600,(H-240)/600),0.3,1.4);
    const offX=(W-600*scale)/2, offY=Math.max(95,(H-200-600*scale)/2);
    ctx.save();
    ctx.translate(offX,offY); ctx.scale(scale,scale);
    ctx.fillStyle='#fff'; ctx.fillRect(-14,-14,628,628);
    for(let i=0;i<sc.regions.length;i++){
      ctx.beginPath(); sc.regions[i].path(ctx);
      ctx.fillStyle=this.fills[i]||'#f2f0ec';
      ctx.fill();
    }
    for(let i=0;i<sc.regions.length;i++){
      ctx.beginPath(); sc.regions[i].path(ctx);
      ctx.strokeStyle='rgba(70,50,40,.75)'; ctx.lineWidth=3.5; ctx.stroke();
    }
    sc.decor(ctx);
    ctx.restore();
    ctx.strokeStyle='rgba(160,120,80,.6)'; ctx.lineWidth=3;
    roundRect(ctx,offX-14,offY-14,600*scale+28,600*scale+28,10); ctx.stroke();
    // палитра
    const n=PALETTE.length, step=Math.min(54,(W-40)/n), total=step*n, x0=(W-total)/2, py2=H-48;
    for(let i=0;i<n;i++){

      ctx.lineWidth=this.selColor===PALETTE[i]?5:2.5; ctx.stroke();
    }
    FX.draw(t);
  }
};

const memory={
  state:'idle', level:0, cards:[], open:[], busyUntil:0, moves:0, found:0, pairs:0,
  cols:3, cardW:90, cardH:110, startX:0, startY:0,
  start(level){
    currentGame='memory';
    this.state='playing';
    this.level=clamp(level,0,1);
    this.cols=this.level===0?3:4;
    const total=this.cols*4;
    this.pairs=total/2;
    const chars=[];
    for(let i=0;i<this.pairs;i++) chars.push(i%CHAR_COUNT);
    this.cards=shuffle([...chars,...chars]).map(ch=>({ch, st:'down'}));
    this.open=[]; this.busyUntil=0; this.moves=0; this.found=0;
    miniUI(); ambient.set(THEMES[5]);
    this.syncHud();
    showHint('Открывай карточки и находи одинаковых героев! 🃏',3500);
  },
  syncHud(){ setHudProgress(`Мемори ${this.level+1} · Ходов: ${this.moves} · Пары: ${this.found}/${this.pairs}`); },
  layout(){
    this.cardW=clamp(Math.floor((W-60)/this.cols-12),56,96);
    this.cardH=Math.floor(this.cardW*1.22);
    const gw=this.cols*this.cardW+(this.cols-1)*12;
    this.startX=(W-gw)/2;
    const gh=4*this.cardH+3*12;
    this.startY=Math.max(120,(H-gh-70)/2);
  },
  handleClick(px,py){
    if(this.state!=='playing') return;
    if(this.busyUntil>0) return;
    this.layout();
    for(let i=0;i<this.cards.length;i++){
      const cd=this.cards[i];
      if(cd.st!=='down') continue;
      const r=Math.floor(i/this.cols), cc=i%this.cols;
      const x=this.startX+cc*(this.cardW+12), y=this.startY+r*(this.cardH+12);
      if(px>=x&&px<=x+this.cardW&&py>=y&&py<=y+this.cardH){
        cd.st='up'; sfxClick();
        this.open.push(i);
        if(this.open.length===2){
          this.moves++; this.syncHud();
          const [a,b]=this.open.map(j=>this.cards[j]);
          if(a.ch===b.ch){
            setTimeout(()=>{
              a.st='done'; b.st='done';
              this.found++; sfxMatch(a.ch);
              this.open=[]; this.syncHud();
              const gi=this.cards.indexOf(a);
              const r=Math.floor(gi/this.cols), cc=gi%this.cols;
              FX.burstParticles(this.startX+cc*(this.cardW+12)+this.cardW/2, this.startY+r*(this.cardH+12)+this.cardH/2, CHARACTERS[a.ch], 8, .8);
              if(this.found>=this.pairs){
                this.state='complete'; sfxWin(); FX.spawnConfetti();
                const stars=this.moves<=this.pairs+1?3:(this.moves<=this.pairs*2?2:1);
                setTimeout(()=>showWin('memory',this.level,stars,`Ходов: ${this.moves}`),800);
              }
            },300);
            this.open=[];
          } else {
            this.busyUntil=performance.now()/1000+0.75;
            sfxError();
          }
        }
        return;
      }
    }
  },
  update(dt){
    if(this.state!=='playing') return;
    if(this.busyUntil>0&&performance.now()/1000>=this.busyUntil){
      for(const j of this.open) if(this.cards[j].st==='up') this.cards[j].st='down';
      this.open=[]; this.busyUntil=0;
    }
  },
  render(t){
    this.layout();
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#fff0f5'); bg.addColorStop(1,'#ffe0ec');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    for(let i=0;i<this.cards.length;i++){
      const cd=this.cards[i];
      const r=Math.floor(i/this.cols), cc=i%this.cols;
      const x=this.startX+cc*(this.cardW+12), y=this.startY+r*(this.cardH+12);
      if(cd.st==='done'){
        ctx.globalAlpha=.35;
      }
      roundRect(ctx,x,y,this.cardW,this.cardH,14);
      if(cd.st==='down'){
        const gCard=ctx.createLinearGradient(x,y,x,y+this.cardH);
        gCard.addColorStop(0,'#9d4edd'); gCard.addColorStop(1,'#6a2fa0');
        ctx.fillStyle=gCard; ctx.fill();
        ctx.strokeStyle='#5a2590'; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.85)';
        ctx.font=`900 ${Math.floor(this.cardW*.5)}px system-ui`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('?',x+this.cardW/2,y+this.cardH/2+2);
      } else {
        ctx.fillStyle='#fffdf5'; ctx.fill();
        ctx.strokeStyle=cd.st==='done'?'#b8d8b8':CHARACTERS[cd.ch].color; ctx.lineWidth=3; ctx.stroke();
        ctx.save(); ctx.translate(x+this.cardW/2,y+this.cardH/2+6);
        CHARACTERS[cd.ch].draw(ctx,this.cardW/110,1);
        ctx.restore();
      }
      ctx.globalAlpha=1;
    }
    FX.draw(t);
  }
};

const starCatch={
  state:'idle', level:0, items:[], score:0, goal:0, left:0, spawnT:0, elapsed:0,
  start(level){
    currentGame='catch';
    this.state='playing';
    this.level=clamp(level,0,2);

    showHint('Лови звёздочки, нотки и сердечки! ⭐',3000);
  },
  syncHud(){ setHudProgress(`⭐ ${this.score}/${this.goal} · ${Math.ceil(this.left)}с`); },
  handleClick(px,py){
    if(this.state!=='playing') return;
    for(let i=this.items.length-1;i>=0;i--){
      const it=this.items[i];
      if(Math.hypot(px-it.x,py-it.y)<it.r+8){
        this.items.splice(i,1);
        this.score++;
        sfxPop(this.score%6);
        FX.burstParticles(it.x,it.y,{particles:it.type===0?'#ffd23f':(it.type===1?'#bfe6ff':'#ff70a6'),shape:it.type===0?'star':(it.type===1?'bubble':'heart'),dir:0},7,.8);
        this.syncHud();
        return;
      }
    }
  },
  update(dt){
    if(this.state!=='playing') return;
    this.elapsed+=dt; this.left-=dt;
    if(this.left<=0){
      this.state='complete';
      const ratio=this.score/this.goal;
      const stars=ratio>=1.3?3:(ratio>=1?2:1);
      sfxWin(); FX.spawnConfetti();
      setTimeout(()=>showWin('catch',this.level,stars,`Поймано: ${this.score} из ${this.goal} ⭐`),800);
      return;
    }
    this.spawnT-=dt;
    if(this.spawnT<=0){
      this.spawnT=Math.max(.28,.75-this.elapsed*.012);
      const type=Math.random()<0.55?0:(Math.random()<0.5?1:2);
      this.items.push({x:rnd(50,W-50),y:-30,vy:120+this.level*30+this.elapsed*3,type,r:20,rot:rnd(0,TAU),vr:rnd(-3,3)});
    }
    for(let i=this.items.length-1;i>=0;i--){
      const it=this.items[i];
      it.y+=it.vy*dt; it.rot+=it.vr*dt;
      if(it.y>H+40) this.items.splice(i,1);
    }
    if(Math.floor(this.left)!==Math.floor(this.left+dt)) this.syncHud();
  },
  render(t){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#141a4a'); bg.addColorStop(1,'#3b3b85');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    for(const it of this.items){
      ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot);
      if(it.type===0){
        ctx.fillStyle='#ffd23f';
        ctx.beginPath();
        for(let i=0;i<10;i++){ const a=i*TAU/10-Math.PI/2; const r=(i%2===0)?it.r:it.r*.45;
          const x=Math.cos(a)*r, y=Math.sin(a)*r; if(i===0)c2move(ctx,x,y); else ctx.lineTo(x,y); }
        ctx.closePath(); ctx.fill();
      } else if(it.type===1){
        ctx.fillStyle='#bfe6ff'; ctx.font='900 34px system-ui';
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♪',0,0);
      } else {
        ctx.fillStyle='#ff70a6';
        const r=it.r*.8;
        ctx.beginPath(); ctx.moveTo(0,r*.4);
        ctx.bezierCurveTo(-r,-r*.3,-r*.5,-r,0,-r*.4);
        ctx.bezierCurveTo(r*.5,-r,r,-r*.3,0,r*.4); ctx.fill();
      }
      ctx.restore();
    }
    FX.draw(t);
  }
};

const countG={
  state:'idle', level:0, round:0, totalRounds:8, num:0, chars:[], options:[], correctIdx:0, mistakes:0, waitT:0, wrongT:0, wrongIdx:-1,
  start(level){
    currentGame='count';
    this.state='playing';
    this.level=clamp(level,0,2);
    this.round=0; this.mistakes=0; this.waitT=0; this.wrongT=0;
    miniUI(); ambient.set(THEMES[3]);
    this.nextRound();
    showHint('Посчитай героев и выбери число! 🔢',3000);
  },
  nextRound(){
    this.round++;
    if(this.round>this.totalRounds){
      this.state='complete'; sfxWin(); FX.spawnConfetti();
      const stars=this.mistakes<=1?3:(this.mistakes<=3?2:1);
      setTimeout(()=>showWin('count',this.level,stars,`Ошибок: ${this.mistakes}`),800);
      return;
    }
    const maxN=Math.min(9,4+this.level*2);
    this.num=2+Math.floor(Math.random()*(maxN-1));
    this.chars=[];
    let guard=80;
    while(this.chars.length<this.num&&guard-->0){
      const x=rnd(90,W-90), y=rnd(190,H-270);
      if(this.chars.every(p=>Math.hypot(p.x-x,p.y-y)>95))
        this.chars.push({x,y,ch:Math.floor(Math.random()*CHAR_COUNT),ph:rnd(0,TAU)});
    }
    this.num=this.chars.length;
    // варианты
    const opts=new Set([this.num]);
    while(opts.size<3){ const v=1+Math.floor(Math.random()*Math.max(4,this.num+2)); if(v<=Math.max(6,this.num+2)) opts.add(v); }
    let arr=[...opts];
    if(arr.length<3) arr.push(this.num+3);
    arr=arr.slice(0,3);
    shuffle(arr);
    this.options=arr;
    this.correctIdx=arr.indexOf(this.num);
    this.wrongIdx=-1; this.wrongT=0;
    this.syncHud();
  },
  syncHud(){ setHudProgress(`Вопрос ${Math.min(this.round,this.totalRounds)}/${this.totalRounds} · Ошибок: ${this.mistakes}`); },
  handleClick(px,py){
    if(this.state!=='playing'||this.waitT>0) return;
    const n=3, step=Math.min(120,(W-40)/n), total=step*n, x0=(W-total)/2, py2=H-90;
    if(py<py2-34||py>py2+34) return;
    for(let i=0;i<n;i++){
      const px2=x0+step*i+step/2;
      if(Math.abs(px-px2)<step/2-8){
        if(i===this.correctIdx){
          sfxPop(3);
          FX.popup(px2,py2-50,'Верно! ✨','#2e7a2e',20);
          for(const ch of this.chars) FX.burstParticles(ch.x,ch.y,{particles:'#ffd23f',shape:'star',dir:0},3,.5);
          this.waitT=.7;
        } else {
          this.mistakes++; this.wrongIdx=i; this.wrongT=.5;
          sfxError(); FX.shake(5);
          this.syncHud();
        }
        return;
      }
    }
  },
  update(dt){
    if(this.state!=='playing') return;
    if(this.waitT>0){ this.waitT-=dt; if(this.waitT<=0) this.nextRound(); }
    if(this.wrongT>0) this.wrongT-=dt;
  },
  render(t){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#fff4e0'); bg.addColorStop(1,'#ffdac0');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    ctx.font='900 34px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#7a3d1a';
    ctx.fillText('Сколько героев?',W/2,140);
    for(const ch of this.chars){
      const bob=Math.sin(t*2+ch.ph)*4;
      ctx.save(); ctx.translate(ch.x,ch.y+bob);
      CHARACTERS[ch.ch].draw(ctx,.62,1);
      ctx.restore();
    }
    const n=3, step=Math.min(120,(W-40)/n), total=step*n, x0=(W-total)/2, py2=H-90;
    for(let i=0;i<n;i++){
      const px2=x0+step*i+step/2;
      const isWrong=this.wrongIdx===i&&this.wrongT>0;
      ctx.beginPath(); roundRect(ctx,px2-step/2+10,py2-34,step-20,68,20);
      ctx.fillStyle=isWrong?'rgba(230,57,70,.9)':'rgba(255,255,255,.94)';
      ctx.fill();
      ctx.strokeStyle=isWrong?'#fff':'#ffb703'; ctx.lineWidth=4; ctx.stroke();
      ctx.fillStyle=isWrong?'#fff':'#7a3d1a';
      ctx.font='900 40px system-ui'; ctx.fillText(this.options[i],px2,py2+2);
    }
    FX.draw(t);
  }
};

const SIL={};
function silhouette(ch){
  if(SIL[ch]) return SIL[ch];
  const cv=document.createElement('canvas'); cv.width=150; cv.height=150;
  const cc=cv.getContext('2d');
  CHARACTERS[ch].draw(cc,1.2,1);
  cc.globalCompositeOperation='source-in';
  cc.fillStyle='#1d2b36';
  cc.fillRect(0,0,150,150);
  SIL[ch]=cv; return cv;
}
const shadowG={
  state:'idle', level:0, round:0, totalRounds:8, answer:0, options:[], correctIdx:0, mistakes:0, waitT:0, wrongT:0, wrongIdx:-1, lastAnswer:-1,
  start(level){
    currentGame='shadow';
    this.state='playing';
    this.level=clamp(level,0,2);
    this.round=0; this.mistakes=0; this.waitT=0;
    this.totalRounds=6+this.level*2;
    miniUI(); ambient.set(THEMES[1]);
    this.nextRound();
    showHint('Кто эта тень? Нажми на правильную карточку! 👥',3200);
  },
  nextRound(){
    this.round++;
    if(this.round>this.totalRounds){
      this.state='complete'; sfxWin(); FX.spawnConfetti();
      const stars=this.mistakes<=1?3:(this.mistakes<=3?2:1);
      setTimeout(()=>showWin('shadow',this.level,stars,`Ошибок: ${this.mistakes}`),800);
      return;
    }
    this.answer=Math.floor(Math.random()*CHAR_COUNT);
    if(this.answer===this.lastAnswer) this.answer=(this.answer+1)%CHAR_COUNT;
    this.lastAnswer=this.answer;
    const nOpt=this.level>=2?4:3;
    const opts=new Set([this.answer]);
    while(opts.size<nOpt) opts.add(Math.floor(Math.random()*CHAR_COUNT));
    const arr=shuffle([...opts]);
    this.options=arr;
    this.correctIdx=arr.indexOf(this.answer);
    this.wrongIdx=-1; this.wrongT=0;
    this.syncHud();
  },
  syncHud(){ setHudProgress(`Тень ${Math.min(this.round,this.totalRounds)}/${this.totalRounds} · Ошибок: ${this.mistakes}`); },
  handleClick(px,py){
    if(this.state!=='playing'||this.waitT>0) return;
    const n=this.options.length;
    const cardW=Math.min(130,(W-60)/n-14), gap=14;
    const total=n*cardW+(n-1)*gap, x0=(W-total)/2;
    const y=H-230;
    if(py<y||py>y+cardW*1.15) return;
    for(let i=0;i<n;i++){
      const x=x0+i*(cardW+gap);
      if(px>=x&&px<=x+cardW){
        if(i===this.correctIdx){
          sfxPop(3);
          FX.popup(W/2,y-40,'Верно! ✨','#ffd23f',22);
          this.waitT=.7;
        } else {
          this.mistakes++; this.wrongIdx=i; this.wrongT=.5;
          sfxError(); FX.shake(5);
          this.syncHud();
        }
        return;
      }
    }
  },
  update(dt){
    if(this.state!=='playing') return;
    if(this.waitT>0){ this.waitT-=dt; if(this.waitT<=0) this.nextRound(); }
    if(this.wrongT>0) this.wrongT-=dt;
  },
  render(t){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#1c2150'); bg.addColorStop(1,'#5b3a72');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.font='900 30px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Кто эта тень?',W/2,120);
    // герой в «прожекторе»
    const sp=ctx.createRadialGradient(W/2,270,20,W/2,270,150);
    sp.addColorStop(0,'rgba(255,246,200,.35)'); sp.addColorStop(1,'rgba(255,246,200,0)');
    ctx.fillStyle=sp; ctx.fillRect(W/2-160,110,320,320);
    ctx.save(); ctx.translate(W/2,270+Math.sin(t*1.5)*6);
    CHARACTERS[this.answer].draw(ctx,1.6,1);
    ctx.restore();
    // карточки теней
    const n=this.options.length;
    const cardW=Math.min(130,(W-60)/n-14), gap=14;
    const total=n*cardW+(n-1)*gap, x0=(W-total)/2;
    const y=H-230;
    for(let i=0;i<n;i++){
      const x=x0+i*(cardW+gap);
      const isWrong=this.wrongIdx===i&&this.wrongT>0;
      roundRect(ctx,x,y,cardW,cardW*1.15,18);
      ctx.fillStyle=isWrong?'rgba(230,57,70,.85)':'rgba(255,255,255,.12)';
      ctx.fill();
      ctx.strokeStyle=isWrong?'#fff':'rgba(255,255,255,.35)'; ctx.lineWidth=3; ctx.stroke();
      const s=cardW*0.95;
      ctx.drawImage(silhouette(this.options[i]),x+(cardW-s)/2,y+(cardW*1.15-s)/2,s,s);
    }
    FX.draw(t);
  }
};

/* ---------- ЧАПАЕВ: шашки-стрелялки ---------- */
const chapaev={
  state:'idle', mode:'pve', level:0, turn:'P', pieces:[], drag:null,
  boardX:0, boardY:0, boardW:0, boardH:0, r:24, _pb:null,
  thinkT:0, moveT:0, ownLost:0, lastHit:0, bound:false,

  start(level){
    currentGame='chapaev';
    this.level=clamp(level,0,3);
    this.mode=this.level===3?'pvp':'pve';
    this.pieces=[]; this.drag=null; this.thinkT=0; this.moveT=0; this.ownLost=0;
    this.turn='P'; this._pb=null;
    miniUI(); ambient.set(THEMES[0]);
    this.bindInput();
    this.layout();
    // расстановка: у котика 2 ряда сверху, у игрока 2 ряда снизу
    const bw=this.boardW, bh=this.boardH, bx=this.boardX, by=this.boardY, r=this.r;
    for(let i=0;i<4;i++){
      const x=bx+bw*(i+0.5)/4;
      this.pieces.push({side:'E', ch:5, x, y:by+bh*0.12, homeX:x, homeY:by+bh*0.12, vx:0, vy:0, out:false});
      this.pieces.push({side:'E', ch:5, x, y:by+bh*0.12+r*2.8, homeX:x, homeY:by+bh*0.12+r*2.8, vx:0, vy:0, out:false});
      this.pieces.push({side:'P', ch:0, x, y:by+bh*0.88, homeX:x, homeY:by+bh*0.88, vx:0, vy:0, out:false});
      this.pieces.push({side:'P', ch:0, x, y:by+bh*0.88-r*2.8, homeX:x, homeY:by+bh*0.88-r*2.8, vx:0, vy:0, out:false});
    }
    this.state='aim';
    this.syncHud();
    showHint(this.mode==='pvp'?'Двое за одним устройством! Тяни свою шашку назад и отпускай 🎯':'Тяни синюю шашку назад и отпускай — сбей оранжевых! 🎯',4200);
  },
  bindInput(){
    if(this.bound) return; this.bound=true;
    const canvas=document.getElementById('game');
    canvas.addEventListener('pointermove',e=>{
      if(currentGame!=='chapaev'||!this.drag) return;
      const r=canvas.getBoundingClientRect();
      this.drag.cx=e.clientX-r.left; this.drag.cy=e.clientY-r.top;
    });
    canvas.addEventListener('pointerup',e=>{
      if(currentGame!=='chapaev'||!this.drag) return;
      const r=canvas.getBoundingClientRect();
      this.release(e.clientX-r.left, e.clientY-r.top);
    });
  },
  layout(){
    const bw=clamp(W-56,260,560);
    const bh=clamp(H-235,300,Math.min(bw*1.32,640));
    const bx=(W-bw)/2;
    const by=Math.max(100,100+(H-190-bh)/2);
    if(this._pb&&(this._pb.w!==bw||this._pb.h!==bh||this._pb.x!==bx||this._pb.y!==by)){
      const kx=bw/this._pb.w, ky=bh/this._pb.h;
      for(const p of this.pieces){
        p.x=bx+(p.x-this._pb.x)*kx; p.y=by+(p.y-this._pb.y)*ky;
        p.homeX=bx+(p.homeX-this._pb.x)*kx; p.homeY=by+(p.homeY-this._pb.y)*ky;
      }
    }
    this._pb={x:bx,y:by,w:bw,h:bh};
    this.boardX=bx; this.boardY=by; this.boardW=bw; this.boardH=bh;
    this.r=clamp(bw/13,16,30);
  },
  syncHud(){
    const blue=this.pieces.filter(p=>p.side==='P'&&!p.out).length;
    const org=this.pieces.filter(p=>p.side==='E'&&!p.out).length;
    let who;
    if(this.mode==='pvp') who=this.turn==='P'?'Ход СИНИХ':'Ход ОРАНЖЕВЫХ';
    else who=this.turn==='P'?'ТВОЙ ХОД':'Котики целятся…';
    setHudProgress(`Чапаев · Синих ${blue} : ${org} Оранжевых · ${who}`);
  },
  handleClick(px,py){
    if(this.state!=='aim') return;
    if(this.mode==='pve'&&this.turn==='E') return;
    for(const p of this.pieces){
      if(p.out||p.side!==this.turn) continue;
      if(Math.hypot(px-p.x,py-p.y)<this.r+10){
        this.drag={p,cx:px,cy:py}; sfxClick(); return;
      }
    }
  },
  release(px,py){
    const p=this.drag.p;
    const dx=p.x-px, dy=p.y-py;
    const d=Math.hypot(dx,dy);
    this.drag=null;
    if(d<14){ this.syncHud(); return; }
    const pow=Math.min(d,175)*5.1;
    p.vx=dx/d*pow; p.vy=dy/d*pow;
    this.state='moving'; this.moveT=0;
    sfxClick();
  },
  aiMove(){
    const err=[0.4,0.18,0.07][this.level]||0.2;
    const my=this.pieces.filter(p=>p.side==='E'&&!p.out);
    const tg=this.pieces.filter(p=>p.side==='P'&&!p.out);
    if(!my.length||!tg.length){ this.endTurn(); return; }
    let best=null;
    for(const m of my)for(const t of tg){
      const d=Math.hypot(m.x-t.x,m.y-t.y);
      const score=d+Math.random()*err*600;
      if(!best||score<best.score) best={m,t,score};
    }
    const m=best.m, t=best.t;
    let dx=t.x-m.x, dy=t.y-m.y;
    const L=Math.hypot(dx,dy)||1;
    const ang=(Math.random()-0.5)*err*2;
    const ca=Math.cos(ang), sa=Math.sin(ang);
    const ndx=dx*ca-dy*sa, ndy=dx*sa+dy*ca;
    const NL=Math.hypot(ndx,ndy)||1;
    const pow=clamp(320+L*2.4,520,1250)*(0.9+Math.random()*0.25);
    m.vx=ndx/NL*pow; m.vy=ndy/NL*pow;
    this.state='moving'; this.moveT=0;
    sfxClick();
  },
  freeHome(side, p){
    const homes=this.pieces.filter(q=>q.side===side).map(q=>({x:q.homeX,y:q.homeY}));
    const taken=(x,y)=>this.pieces.some(q=>!q.out&&Math.hypot(q.x-x,q.y-y)<this.r*2.05);
    if(!taken(p.homeX,p.homeY)) return {x:p.homeX,y:p.homeY};
    for(const h of homes){ if(!taken(h.x,h.y)) return h; }
    return {x:p.homeX,y:p.homeY};
  },
  endTurn(){
    const mover=this.turn;
    const other=mover==='P'?'E':'P';
    const otherAlive=this.pieces.filter(p=>p.side===other&&!p.out).length;
    if(this.mode==='pve'){
      if(other==='E'&&otherAlive===0){
        const stars=this.ownLost===0?3:(this.ownLost<=2?2:1);
        this.state='over'; sfxWin(); FX.spawnConfetti();
        setTimeout(()=>showWin('chapaev',this.level,stars,`Потеряно своих: ${this.ownLost}`),900);
        return;
      }
      if(other==='P'&&otherAlive===0){
        this.state='over';
        setTimeout(()=>showLose('chapaev',this.level,'Котики выбили все твои шашки!'),700);
        return;
      }
      this.turn=other;
      if(this.turn==='E') this.thinkT=0.8;
      this.state='aim'; this.syncHud();
    } else {
      if(otherAlive===0){ this.state='over'; this.pvpWin(mover); return; }
      this.turn=other; this.state='aim'; this.syncHud();
    }
  },
  pvpWin(winnerSide){
    const name=winnerSide==='P'?'СИНИЕ':'ОРАНЖЕВЫЕ';
    sfxWin(); FX.spawnConfetti();
    elOverlay.innerHTML=`
      <h1>🏆 Победили ${name}!</h1>
      <div class="ostars">🎉🎉🎉</div>
      <div class="btn-row">
        <button class="next-btn" id="againBtn">🔄 Ещё раз</button>
        <button class="next-btn secondary" id="menuBtn2">🏠 В меню</button>
      </div>`;
    elOverlay.classList.remove('hidden');
    document.getElementById('againBtn').addEventListener('click',()=>chapaev.start(3));
    document.getElementById('menuBtn2').addEventListener('click',showMenu);
  },
  update(dt){
    if(this.state==='aim'&&this.mode==='pve'&&this.turn==='E'){
      this.thinkT-=dt;
      if(this.thinkT<=0){ this.thinkT=0; this.aiMove(); }
    }
    if(this.state!=='moving') return;
    this.moveT+=dt;
    const sub=2, h=dt/sub;
    for(let s2=0;s2<sub;s2++){
      for(const p of this.pieces){
        if(p.out) continue;
        p.x+=p.vx*h; p.y+=p.vy*h;
        const f=Math.exp(-1.7*h);
        p.vx*=f; p.vy*=f;
      }
      const alive=this.pieces.filter(p=>!p.out);
      for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
        const a=alive[i], b=alive[j];
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.001;
        if(d<this.r*2){
          const nx=dx/d, ny=dy/d, ov=(this.r*2-d)/2;
          a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
          const rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nx+rvy*ny;
          if(vn<0){
            const imp=-vn*0.96;
            a.vx-=nx*imp; a.y-=ny*imp; b.vx+=nx*imp; b.vy+=ny*imp;
            if(imp>70){
              const now=performance.now()/1000;
              if(now-this.lastHit>0.06){ this.lastHit=now; sfxPop(2); }
            }
          }
        }
      }
      for(const p of this.pieces){
        if(p.out) continue;
        if(p.x<this.boardX-this.r*0.5||p.x>this.boardX+this.boardW+this.r*0.5||p.y<this.boardY-this.r*0.5||p.y>this.boardY+this.boardH+this.r*0.5){
          if(p.side===this.turn){
            this.ownLost++;
            const spot=this.freeHome(p.side,p);
            p.x=spot.x; p.y=spot.y; p.vx=0; p.vy=0;
            FX.popup(clamp(p.x,this.boardX+40,this.boardX+this.boardW-40),clamp(p.y,this.boardY+30,this.boardY+this.boardH-30),'Вернулась 🔄','#7a3d1a',13);
          } else {
            p.out=true;
            const who=this.turn==='P'?'Ты выбил! +1':'Котик выбил';
            FX.popup(clamp(p.x,this.boardX+40,this.boardX+this.boardW-40),clamp(p.y,this.boardY+30,this.boardY+this.boardH-30),who,this.turn==='P'?'#2e7a2e':'#e85a2a',15);
            sfxPop(4);
          }
          this.syncHud();
        }
      }
    }
    const moving=this.pieces.some(p=>!p.out&&(Math.abs(p.vx)>12||Math.abs(p.vy)>12));
    if(!moving||this.moveT>7){
      for(const p of this.pieces){ p.vx=0; p.vy=0; }
      this.endTurn();
    }
  },
  render(t){
    this.layout();
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#e8f0d8'); bg.addColorStop(1,'#c8ddb0');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ambient.update(1/60); ambient.draw(t);
    // рамка-стол
    ctx.fillStyle='#8a5a2a';
    roundRect(ctx,this.boardX-14,this.boardY-14,this.boardW+28,this.boardH+28,16); ctx.fill();
    // клетчатое поле
    const cols=8, rows=6, cw=this.boardW/cols, chh=this.boardH/rows;
    for(let r2=0;r2<rows;r2++)for(let cc=0;cc<cols;cc++){
      ctx.fillStyle=(r2+cc)%2===0?'#f0e6c8':'#dccfa8';
      ctx.fillRect(this.boardX+cc*cw,this.boardY+r2*chh,cw+0.5,chh+0.5);
    }
    // подсветка шашек текущего хода
    if(this.state==='aim'){
      const pulse=0.5+0.4*Math.sin(t*6);
      for(const p of this.pieces){
        if(p.out||p.side!==this.turn) continue;
        ctx.strokeStyle=`rgba(255,183,3,${pulse})`;
        ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(p.x,p.y,this.r+5,0,TAU); ctx.stroke();
      }
    }
    // шашки
    for(const p of this.pieces){
      if(p.out) continue;
      ctx.fillStyle='rgba(0,0,0,.18)';
      ctx.beginPath(); ctx.ellipse(p.x,p.y+this.r*0.25,this.r*0.95,this.r*0.5,0,0,TAU); ctx.fill();
      {
        ctx.save();
        ctx.beginPath(); ctx.arc(p.x,p.y,this.r*0.88,0,TAU); ctx.clip();
        ctx.fillStyle=p.side==='P'?'#dfe9f5':'#ffe3c2';
        ctx.fillRect(p.x-this.r,p.y-this.r,this.r*2,this.r*2);
        ctx.translate(p.x,p.y+this.r*0.3);
        ctx.scale(this.r/52,this.r/52);
        CHARACTERS[p.ch].draw(ctx,1,0.9);
        ctx.restore();
      }
      ctx.lineWidth=(this.state==='aim'&&p.side===this.turn)?3.5:3;
      ctx.strokeStyle=p.side==='P'?'#2c6ec2':'#e8702a';
      ctx.beginPath(); ctx.arc(p.x,p.y,this.r,0,TAU); ctx.stroke();
    }
    // прицел при натяжении
    if(this.drag){
      const p=this.drag.p;
      const dx=p.x-this.drag.cx, dy=p.y-this.drag.cy;
      const d=Math.hypot(dx,dy);
      ctx.strokeStyle='rgba(80,80,80,.5)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(this.drag.cx,this.drag.cy); ctx.stroke();
      if(d>6){
        const pow=Math.min(d,175), len=pow*1.5;
        const nx=dx/d, ny=dy/d;
        ctx.setLineDash([9,9]);
        ctx.strokeStyle='rgba(255,90,60,.95)'; ctx.lineWidth=4; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+nx*len,p.y+ny*len); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(255,90,60,.95)';
        ctx.beginPath(); ctx.arc(p.x+nx*len,p.y+ny*len,7,0,TAU); ctx.fill();
      }
    }
    FX.draw(t);
  }
};

const GAME_MAP={mahjong, match3, singers, puzzle, coloring, memory, catch:starCatch, count:countG, shadow:shadowG, chapaev};
// счётчик запусков каждой игры
for(const __k in GAME_MAP){
  const __g=GAME_MAP[__k];
  const __orig=__g.start.bind(__g);
  __g.start=function(l){ LB.countPlay(__k); return __orig(l); };
}

/* ================= МЕНЮ ФОН ================= */
const MENU_SPOTS=[[.1,.16],[.9,.2],[.06,.5],[.94,.55],[.12,.86],[.88,.86],[.5,.07]];
function drawMenuBg(t){
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#fff4e0'); bg.addColorStop(.5,'#ffe8cc'); bg.addColorStop(1,'#ffdac0');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  for(let i=0;i<20;i++){
    const x=(i*137.5+t*20)%W;
    const y=(i*271.3+Math.sin(t+i)*30)%H;
    const r=3+Math.sin(t*2+i)*1.5;
    ctx.fillStyle=`rgba(255,200,160,${0.2+Math.sin(t*1.5+i)*0.15})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
  // герои плавают по краям
  for(let i=0;i<CHAR_COUNT&&i<MENU_SPOTS.length;i++){
    const [fx,fy]=MENU_SPOTS[i];
    const x=W*fx, y=H*fy+Math.sin(t*1.3+i*1.7)*12;
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*.8+i)*.08);
    drawCharAt(i,54,t);
    ctx.restore();
  }
}

/* ================= ВВОД ================= */
canvas.addEventListener('pointerdown',(e)=>{
  ac();
  const rect=canvas.getBoundingClientRect();
  const px=e.clientX-rect.left, py=e.clientY-rect.top;
  const g=GAME_MAP[currentGame];
  if(g&&g.handleClick) g.handleClick(px,py);
});

/* ================= КНОПКИ ================= */
elMenu.addEventListener('click',(e)=>{
  const card=e.target.closest('.game-card');
  if(!card) return;
  ac();
  const game=card.dataset.game;
  if(game==='singers'){ singers.start(); return; }
  if(game==='leaderboard'){ showLeaderboard(); return; }
  showLevelSelect(game);
});
elHintBtn.addEventListener('click',()=>{ if(currentGame==='mahjong') mahjong.doHint(); else if(currentGame==='match3') match3.doHint(); else if(currentGame==='singers') singers.startMix(); });
elShuffleBtn.addEventListener('click',()=>{
  if(currentGame==='mahjong') mahjong.doShuffle();
  else if(currentGame==='match3') match3.doShuffle();
  else if(currentGame==='singers') singers.toggleMusic();
});
elHomeBtn.addEventListener('click',showMenu);

let resetArmed=false;
elResetBtn.addEventListener('click',()=>{
  if(!resetArmed){
    resetArmed=true; elResetBtn.textContent='Точно сбросить?';
    setTimeout(()=>{ resetArmed=false; elResetBtn.textContent='Сбросить прогресс'; },2500);
  } else {
    save=freshSave(); persist(); updateMenuProg();
    resetArmed=false; elResetBtn.textContent='Сбросить прогресс';
  }
});

/* ================= RESIZE ================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(currentGame==='mahjong') mahjong.layout();
  else if(currentGame==='match3') match3.layout();
}
window.addEventListener('resize',resize);

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  dt=Math.min(dt,.05);
  time+=dt;
  FX.update(dt);
  const activeGame=GAME_MAP[currentGame];
  if(activeGame&&activeGame.update){ activeGame.update(dt); activeGame.render(time); }
  else drawMenuBg(time);
}

/* ================= ИНИТ ================= */
resize();
ambient.set(THEMES[0]);
updateMenuProg();
buildShopDOM();
LB.trackVisit();
preloadCharacterImages();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
